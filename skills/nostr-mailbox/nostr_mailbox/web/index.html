<noscript><div class="page" style="padding-block: 24px">The nostr-mailbox console signs, verifies and decrypts in this page's own JavaScript; it does nothing with scripts off.</div></noscript>
<template id="docs-modes">
<h2>How It Works</h2>
<p>Crosswire connects people and coding agents over outbound WebSockets. Each Persona has a signing key. A campaign names the relay and the operators whose directives and seals its members trust.</p>
<div class="table-wrap"><table>
  <thead>
    <tr><th>Layer</th><th>What happens on the switchboard</th></tr>
  </thead>
  <tbody>
    <tr><td>Channels and threads</td><td>A private NIP-29 topic has a roster and an epoch keyring. Personal mail is sealed to the reader.</td></tr>
    <tr><td>Live agent wire</td><td>Agents post to <code>bus</code> and subscribe over WebSockets. The relay stores signed records for replay. Each seat acknowledges the messages it handles.</td></tr>
    <tr><td>Intake and dropboxes</td><td>The shared <code>inbox</code> holds pointers. A personal dropbox receives sealed messages and files under the owner’s grants and human approval rules.</td></tr>
    <tr><td>Relay, roster and keys</td><td>Relay membership admits a key to the service. Group membership controls delivery. A reader needs the matching epoch key to open encrypted history.</td></tr>
  </tbody>
</table></div>
<h3>Two Modes on One Relay</h3>
<p>A person can use separate work and personal keys on one machine. Each agent seat can also enroll with its own key, so a recipient can verify who wrote each message.</p>
<div class="table-wrap"><table>
  <thead>
    <tr><th>Mode</th><th>Example</th><th>Who gets access</th></tr>
  </thead>
  <tbody>
    <tr><td>Persona-First</td><td><code>@alice-personal ↔ @dave</code></td><td>Two enrolled Personas exchange pairwise mail. Each can also create private topics and invite collaborators.</td></tr>
    <tr><td>Single campaign topic</td><td><code>#wave-7</code></td><td>An Org can invite an external seat into one topic. A scoped invite carries the topic declaration and the epochs its role permits.</td></tr>
    <tr><td>Org Workspaces</td><td><code>acme-lab</code> with Alice, Bob and Carol</td><td>An Org declaration identifies a campaign, operators and optionally a shared campaign key. Team members can work across private topics with different rosters.</td></tr>
  </tbody>
</table></div>
</template>
<template id="docs-permissions">
<h2>ACLs &amp; Encryption</h2>
<p>Three gates control access. The relay checks the signing key against its membership list. Private groups have their own rosters. Readers decrypt topic records locally with the epochs they hold.</p>
<h3>3-Gate ACL Primitives</h3>
<div class="table-wrap"><table>
  <thead>
    <tr><th>Primitive</th><th>On the wire</th><th>What it grants</th></tr>
  </thead>
  <tbody>
    <tr><td><code>CONNECT</code></td><td>NIP-42 AUTH and NIP-43 admission</td><td>Sign a challenge for this connection. Redeem a single-use invite or return with an enrolled key. The console verifies a protected read before showing any rooms.</td></tr>
    <tr><td><code>CREATE CHANNEL</code></td><td>NIP-29 group creation (9007)</td><td>An enrolled seat creates a private topic, becomes its keeper and generates the first topic key.</td></tr>
    <tr><td><code>READ</code></td><td>Group subscription and NIP-59 key delivery</td><td>Replay the granted epochs and follow new messages. Full history grants every held epoch. Forward-only admission rotates the key first.</td></tr>
    <tr><td><code>WRITE</code></td><td>Signed events and sealed mail</td><td>Read-write seats post encrypted records. The console holds observer posts for review. Write-only senders deliver sealed mail to the keeper and receive no epoch keys.</td></tr>
    <tr><td><code>MANAGE</code></td><td>NIP-29 roster changes (9000 and 9001)</td><td>The keeper admits or removes topic members and rotates keys. Campaign roles separately authorize claims decisions, Route Board updates, directives and seals.</td></tr>
    <tr><td><code>POOL &lt;user&gt;/agents</code></td><td>Independent seat public keys</td><td>Enroll and grant each seat. A person-signed certificate can identify a mail sender. Topic access requires a grant to that seat.</td></tr>
  </tbody>
</table></div>
<h3>Concrete Permission Matrix</h3>
<div class="table-wrap"><table>
  <thead>
    <tr><th>Scope</th><th>Principal</th><th>Permissions</th><th>Keys and history</th></tr>
  </thead>
  <tbody>
    <tr><td>Org · <code>acme-lab</code></td><td>Alice, relay operator</td><td>CONNECT · CREATE CHANNEL · relay administration</td><td>Enroll or evict a public key. Rotate the affected topic epochs when removing a reader.</td></tr>
    <tr><td>Org · <code>acme-lab</code></td><td>Bob and Carol, members</td><td>CONNECT · CREATE CHANNEL</td><td>Their declaration opens the Org bus when it carries its campaign key. Private topics have independent rosters.</td></tr>
    <tr><td>Team relay</td><td>Vendor with a topic invite</td><td>CONNECT · invited role</td><td>The topic token omits the Org campaign key.</td></tr>
    <tr><td><code>#wave-7</code></td><td>Alice, keeper</td><td>READ · WRITE · MANAGE</td><td>Choose the role and history for each admission. Rotate on removal.</td></tr>
    <tr><td><code>#wave-7</code></td><td>Bob and the enrolled agent seats</td><td>READ · WRITE</td><td>Each seat signs as itself and decrypts the epochs it received.</td></tr>
    <tr><td><code>#wave-7</code></td><td>Monitor, observer</td><td>READ</td><td>Can follow stored and live events. The console quarantines its posts. CLI readers can see them.</td></tr>
    <tr><td><code>#partners-only</code></td><td>Alice, Bob and Carol</td><td>READ · WRITE</td><td>Keep the topic keys on the human participants’ devices.</td></tr>
    <tr><td><code>#partners-only</code></td><td>Unenrolled agents</td><td>None</td><td>No group subscription or epoch keys. A process with access to a human’s local key files can act as that human.</td></tr>
    <tr><td><code>#external-intake</code></td><td>Alice, owner</td><td>READ · WRITE · MANAGE</td><td>Decrypt submissions and approve or reject them at the human gate.</td></tr>
    <tr><td><code>#external-intake</code></td><td>Vendor, external sender</td><td>WRITE</td><td>Send to the designated dropbox part using the keeper’s public key.</td></tr>
    <tr><td>Personal thread</td><td>Alice-personal and Dave</td><td>Send and read addressed mail</td><td>Pairwise encryption identifies the recipient of each message.</td></tr>
  </tbody>
</table></div>
<p>Removing a reader stops future delivery. Rotation distributes a new epoch only to the remaining readers. Anyone who received an earlier epoch can still open records encrypted under it.</p>

<h2>CLI, MCP &amp; Self-Hosting</h2>
<h3>CLI Quickstart</h3><p>The package installs both <code>crosswire</code> and <code>nostr-mailbox</code>. In these examples Alice operates the relay and keeps the topic. Bob joins from his own machine.</p>
<div class="grid2">
  <section class="card"><h3>Set up a relay you operate</h3><pre><code>crosswire setup --relay &quot;$RELAY_URL&quot; --campaign team --kubectl
crosswire relay check
crosswire ui --open</code></pre></section>
  <section class="card"><h3>Create a channel and invite a reader</h3><pre><code>crosswire topic create wave-7
crosswire topic invite wave-7 --admin --for bob --role read-write --history all --code-file bob.token</code></pre></section>
  <section class="card"><h3>Join and coordinate</h3><pre><code>crosswire join --code-file bob.token
crosswire --topic wave-7 post bus &quot;Taking retry.py&quot; --kind handoff
crosswire --topic wave-7 watch bus --wait-seconds 25
crosswire --topic wave-7 ack bus EVENT_ID --result-ref PR-41</code></pre></section>
  <section class="card"><h3>Record evidence and rotate a room key</h3><pre><code>crosswire condition open ac-3 --goal &quot;Idempotent retries&quot; --statement &quot;No duplicate on lost OK&quot; --next-action &quot;Reproduce&quot;
crosswire handoff materialize --condition ac-3 --out HANDOFF.md
crosswire topic revoke wave-7 BOB_NPUB</code></pre></section>
</div>
<h3>Six MCP tools</h3><p>Start <code>crosswire mcp</code> for stdio. Tools take an optional <code>persona</code>. The HTTP connector exposes the same operations.</p><div class="table-wrap"><table>
  <thead>
    <tr><th>Tool</th><th>Inputs</th><th>Operation</th></tr>
  </thead>
  <tbody>
    <tr><td><code>mailbox_list</code></td><td>persona?</td><td>List local Personas, Orgs and channels. Identify the channel that bus refers to.</td></tr>
    <tr><td><code>mailbox_invite</code></td><td>target, scope?, role?, history?, recipient?</td><td>Mint an Org or topic invite. Use code_file to keep its bearer out of tool output.</td></tr>
    <tr><td><code>mailbox_join</code></td><td>token_or_url, as_member?</td><td>Redeem a link under the selected Persona and save its declaration.</td></tr>
    <tr><td><code>mailbox_post</code></td><td>channel, body, kind?, subject?, files?</td><td>Publish a signed record with optional encrypted attachments.</td></tr>
    <tr><td><code>mailbox_watch</code></td><td>channel, wait_seconds?, history?, ack_id?, result_ref?</td><td>Watch unsettled messages, read history, or acknowledge work for this seat.</td></tr>
    <tr><td><code>mailbox_board</code></td><td>action, channel?, params?</td><td>Manage routes, conditions, claims, decisions, checkpoints and handoffs.</td></tr>
  </tbody>
</table></div>
<h3>Self-hosting targets</h3>
<p>In <a href="https://github.com/awowIO/nostr-relay-deploy">awowIO/nostr-relay-deploy</a>, copy <code>relay.toml.example</code> to <code>relay.local.toml</code> and configure your hostname, storage and admin settings. Run <code>python3 scripts/hydrate.py --target all</code> to render the targets under <code>.build/</code>.</p>
<div class="table-wrap"><table>
  <thead>
    <tr><th>Target</th><th>Runtime and storage</th><th>Operator entry point</th></tr>
  </thead>
  <tbody>
    <tr><td>Cloudflare Workers</td><td>WebSocket Worker, SQLite Durable Object, R2 blobs and the browser console.</td><td>Use the deployment repository’s cf_ncli_shim.py with --exec.</td></tr>
    <tr><td>Docker Compose</td><td>Caddy terminates TLS. The ncli daemon writes events and blobs on a volume.</td><td>Pass --compose with the generated compose.yaml.</td></tr>

<h3>Multi-Agent Campaign Blueprints</h3>
<div class="grid2">
<section class="card"><h3>Distributed experiments</h3><p>Give each worker an invite to <code>#exp-campaign</code>. Before starting a run, record the hypothesis and its falsification criterion with <code>crosswire route put</code>. Upload metrics with <code>crosswire --topic exp-campaign blob put --encrypt metrics.json</code> and submit their digest with a claim. A reviewer rules on the evidence.</p></section>
<section class="card"><h3>Parallel verification and review</h3><p>Workers in <code>#verify-campaign</code> reserve separate review routes. Container seats can use a host-side signer socket. A verifier replays the submitted artifact, records its decision and materializes the four-field handoff for the next seat.</p></section>

    digest(got.candidate_digest, 'claim candidate_digest');
    if (!got.evidence_refs.length) throw new NMError('a claim needs at least one evidence reference to review');
    got.evidence_refs.forEach((r) => line(r, 'claim evidence reference'));

  function parseDecision(ev, p) {

    const d = { statement: '', reopen_if: '', ...got };
    checkDecision(d);
    if (JSON.stringify(tagValues(ev, 'e')) !== JSON.stringify([d.claim])) throw new NMError('e tag does not name the claim decided');

  }
  function checkDecision(d) {
    digest(d.claim, 'decision claim id'); slug(d.condition, 'decision condition');
    if (!Number.isInteger(d.condition_rev) || d.condition_rev < 1) throw new NMError('decision condition_rev is an integer from 1');
    if (!['accepted', 'narrowed', 'rejected'].includes(d.outcome)) throw new NMError(`decision outcome ${d.outcome} must be accepted, narrowed or rejected`);
    line(d.reason, 'decision reason'); text(d.next_action, 'decision next_action'); digest(d.candidate_digest, 'decision candidate_digest');
    if (d.outcome === 'narrowed') text(d.statement, 'the narrowed condition statement');

  const HANDOFF_FIELDS = [['original_goal', 'Original goal'], ['open_condition', 'Open condition'], ['evidence_and_rejected_routes', 'Evidence & rejected routes'], ['next_action', 'Next action']];
  function checkHandoff(h) {
    const headings = new Set(HANDOFF_FIELDS.map(([, l]) => `## ${l}`));
    for (const [k, l] of HANDOFF_FIELDS) {
      text(h[k], `handoff field ${JSON.stringify(l)}`);
      const clash = h[k].split('\n').find((ln) => headings.has(ln.trim()) || ln.startsWith('<!--'));
      if (clash !== undefined) throw new NMError(`handoff field ${JSON.stringify(l)} carries a line that reads as a field heading or a provenance line: ${JSON.stringify(clash)}`);

  function renderHandoff(packet, provenance) {

    if (!provenance) return body;
    const pairs = Object.entries(provenance).map(([n, v]) => `${n}=${String(v).replaceAll('--', '—')}`).join('; ');

  function parseDirective(p) {

  /** profile.resolve_directives: the unbroken chain from sequence 1; forks are held until

  function resolveDirectives(verified) {

    for (const d of verified) {

      else if (d.seq === seq) held.set(d.id, `sequence ${seq} does not follow the directive in force`);
      else held.set(d.id, `gap: sequence ${d.seq} cannot apply before sequence ${seq} is in force`);

  const PREAMBLE = "# The operator's standing word: appended only; the one edit is a dated `retired <date> by <entry or reason>` mark on an entry's header\n";

  /** The journal and everything else one scope holds, rebuilt from its signed events
      exactly as backend.py reads them. Anything that does not decode goes to
      `rejected` with its reason: shown, never silently dropped. */
  function buildView(scope, events, opts = {}) {
    const rejected = [], rec = new Map();      // kind -> [{ev, payload, epoch, topic}]
    for (const ev of order(events)) {
      if (!CAMPAIGN_KINDS.has(ev.kind)) continue;
      if (scope.group === null && tagValues(ev, 'h').length) continue;   // another topic's
      const t = tagValues(ev, 't');
      if (t.length !== 1) { rejected.push({ id: ev.id, reason: `routing tag ${JSON.stringify(t)} is not exactly one value` }); continue; }
      let topic = null;
      if (t[0] !== scope.campaign) {
        if (!t[0].startsWith(scope.campaign + ':')) continue;              // another campaign's
        topic = t[0].slice(scope.campaign.length + 1);
        if (!SLUG.test(topic)) { rejected.push({ id: ev.id, reason: `topic ${topic} is not a slug` }); continue; }
      }
      try {
        const { payload, epoch } = decodeRecord(scope, ev, ev.kind, RECORD_TYPE[ev.kind], topic);
        if (!rec.has(ev.kind)) rec.set(ev.kind, []);
        rec.get(ev.kind).push({ ev, payload, epoch, topic });
      } catch (e) { rejected.push({ id: ev.id, kind: ev.kind, reason: `${RECORD_TYPE[ev.kind]}: ${e.message}`, code: e.code }); }
    }
    const rows = (kind) => rec.get(kind) || [];
    const ops = new Set(scope.trust.operator_pubkeys), reviewers = new Set(scope.trust.reviewers);
    const epochOf = new Map();
    for (const list of rec.values()) for (const r of list) epochOf.set(r.ev.id, r.epoch);

    // seals: an operator-signed manifest of the exact message ids, per topic
    const seals = new Map();
    for (const r of rows(KIND.SEAL)) {
      if (r.topic === null || !ops.has(r.ev.pubkey) || seals.has(r.topic)) continue;
      try {
        const got = fields(r.payload, { topic: 'str', count: 'int', manifest_sha256: 'str' }, { ids: 'list' });
        if (got.topic !== r.topic) throw new NMError('seals another topic');
        if (!got.ids) { seals.set(r.topic, { id: r.ev.id, ids: null, manifest: got.manifest_sha256, count: got.count }); continue; }
        if (got.ids.length !== got.count || new Set(got.ids).size !== got.ids.length || !got.ids.every((i) => HEX64.test(i)) || hex(sha256(utf8(got.ids.join('\n')))) !== got.manifest_sha256) throw new NMError('seal manifest does not match its own count and digest');
        seals.set(r.topic, { id: r.ev.id, ids: got.ids, manifest: got.manifest_sha256, count: got.count });
      } catch (e) { rejected.push({ id: r.ev.id, reason: `seal: ${e.message}` }); }
    }
    // messages: one canonical message per (author, key), the earliest copy
    const journals = new Map();
    for (const r of rows(KIND.MESSAGE)) {
      let m;
      try { m = parseMessage(scope, r.topic, r.ev, r.payload); } catch (e) { rejected.push({ id: r.ev.id, reason: `message: ${e.message}` }); continue; }

        messages = seal.ids.filter((i) => j.physical.has(i)).map((i) => link(j.physical.get(i)));

    for (const r of rows(KIND.ACK)) {
      let a;
      try { a = parseAck(r.ev, r.payload); } catch (e) { rejected.push({ id: r.ev.id, reason: `ack: ${e.message}` }); continue; }

    for (const r of rows(KIND.DIRECTIVE)) {

  /** backend.triage over a built view. */
  function triage(view, { target, surface } = {}, at = nowS()) {

    const settled = new Set(tv.acks.filter((a) => settles(INBOX, a)).map((a) => a.msg_id));
    const wanted = [...(target ? [`target:${target}`] : []), ...(surface ? [`surface:${surface}`] : [])];
    const open = tv.messages.filter((m) => !settled.has(m.id) && wanted.every((w) => m.refs.includes(w)));
    const targets = {};
    for (const m of open) {
      const ref = m.refs.find((r) => r.startsWith('target:'));
      const name = ref ? ref.slice(7) : '(no target)';
      const row = targets[name] || (targets[name] = { count: 0, oldest_age_hours: 0, items: [] });
      row.count += 1; row.items.push(m);
      row.oldest_age_hours = Math.max(row.oldest_age_hours, Math.round(((at - m.created_at) / 3600) * 100) / 100);
    }
    for (const row of Object.values(targets)) row.compaction_due = row.count >= C.COMPACTION_MAX_ITEMS || row.oldest_age_hours >= C.COMPACTION_MAX_AGE_HOURS;

  // ------------------------------------------------------ NIP-59 gift wrap (kind 1059)
  /** rumor → seal (13) → wrap (1059). Seal and wrap are signed by the sender's member
      key, never an ephemeral one: a private relay refuses any event whose author is not
      the key that authenticated the socket. For the same reason created_at is not
      randomized: the wrapper names its sender anyway, and the relay pages by time. */
  async function giftWrap(signer, recipient, rumorTemplate) {
    const me = await signer.getPublicKey();
    const rumor = { pubkey: me, created_at: rumorTemplate.created_at || nowS(), kind: rumorTemplate.kind, tags: rumorTemplate.tags, content: rumorTemplate.content };
    rumor.id = eventId(rumor);
    const seal = await signer.signEvent({ kind: KIND.NIP59_SEAL, tags: [], content: await signer.nip44Encrypt(recipient, JSON.stringify(rumor)), created_at: nowS() });
    return signer.signEvent({ kind: KIND.GIFT_WRAP, tags: [['p', recipient]], content: await signer.nip44Encrypt(recipient, JSON.stringify(seal)), created_at: nowS() });
  }
  async function unwrapGift(signer, wrap) {
    const w = verifyEvent(wrap);
    if (w.kind !== KIND.GIFT_WRAP) throw new NMError(`kind ${w.kind} is not a gift wrap`);
    let seal;
    try { seal = verifyEvent(JSON.parse(await signer.nip44Decrypt(w.pubkey, w.content))); } catch (e) { throw new NMError(`the wrap does not open to a signed seal: ${e.message}`); }
    if (seal.kind !== KIND.NIP59_SEAL) throw new NMError(`the wrap holds kind ${seal.kind}, not a seal (13)`);
    let rumor;
    try { rumor = JSON.parse(await signer.nip44Decrypt(seal.pubkey, seal.content)); } catch (e) { throw new NMError(`the seal does not open to a rumor: ${e.message}`); }
    checkShape(rumor, ['content', 'created_at', 'id', 'kind', 'pubkey', 'tags']);
    if (rumor.pubkey !== seal.pubkey) throw new NMError('the rumor names another author than the key that sealed it');
    if (eventId(rumor) !== rumor.id) throw new NMError('the rumor id is not the hash of the rumor');
    return { rumor, seal, wrap: w };

  // ------------------------------------------------------- NIP-29 topics + key rings
  function keyringContent(campaign, topic, name, epochs, current, mode) {
    const ring = {};
    for (const e of [...epochs].sort((a, b) => a.n - b.n)) ring[String(e.n)] = e.key;
    return JSON.stringify({ schema: KEYRING_SCHEMA, campaign, topic, name, epochs: ring, current, mode });
  }
  function parseKeyring(rumor, campaign) {
    if (rumor.kind !== KIND.KEYRING) throw new NMError(`kind ${rumor.kind} is not a key ring (${KIND.KEYRING})`);
    const body = JSON.parse(rumor.content);
    if (!body || body.schema !== KEYRING_SCHEMA) throw new NMError(`a key ring carries schema ${KEYRING_SCHEMA}`);
    if (body.campaign !== campaign) throw new NMError(`key ring of campaign ${body.campaign}, not ${campaign}`);
    if (!TOPIC_ID.test(body.topic || '')) throw new NMError(`key ring topic ${body.topic} is not a topic id`);
    if (JSON.stringify(tagValues(rumor, 'h')) !== JSON.stringify([body.topic])) throw new NMError('key ring h tag does not name its topic');
    const epochs = [];
    for (const [n, key] of Object.entries(body.epochs || {})) {
      if (!/^[1-9][0-9]*$/.test(n) || typeof key !== 'string' || !HEX64.test(key)) throw new NMError(`key ring epoch ${n} is malformed`);
      epochs.push({ n: Number(n), key });
    }
    if (!epochs.length) throw new NMError('key ring holds no epoch');
    return { topic: body.topic, name: typeof body.name === 'string' ? body.name : body.topic, epochs, current: Number.isInteger(body.current) ? body.current : Math.max(...epochs.map((e) => e.n)), mode: body.mode || '', granter: rumor.pubkey, created_at: rumor.created_at };
  }
  /** The roster and key ring of one topic, from its NIP-29 events and the key rings this
      key holds. Admins: the author of the earliest 9007, and every operator. Members: the
      newest admin-signed 9000/9001 per key. Key rings count only from admins (or self). */
  function topicScope(trust, topic, groupEvents, keyrings, me) {
    const created = order(groupEvents.filter((e) => e.kind === KIND.CREATE_GROUP && firstTag(e, 'h') === topic));
    const creator = created.length ? created[0].pubkey : null;
    const admins = new Set([...trust.operator_pubkeys, ...(creator ? [creator] : [])]);
    const history = new Map();        // pk -> [{at, member, role, id, by}]
    if (creator) history.set(creator, [{ at: created[0].created_at, member: true, role: 'read-write', id: created[0].id, by: creator }]);
    for (const e of order(groupEvents)) {
      if (![KIND.PUT_USER, KIND.REMOVE_USER].includes(e.kind) || firstTag(e, 'h') !== topic || !admins.has(e.pubkey)) continue;
      for (const t of e.tags) {
        if (t[0] !== 'p' || !HEX64.test(t[1] || '')) continue;
        const pk = t[1];
        if (!history.has(pk)) history.set(pk, []);
        const h = history.get(pk), held = h.length ? h[h.length - 1].role : 'read-write';
        h.push({ at: e.created_at, member: e.kind === KIND.PUT_USER, role: e.kind === KIND.PUT_USER ? roleOf(t) : held, id: e.id, by: e.pubkey });
      }
    }
    const state = (pk) => { const h = history.get(pk); return h && h.length ? h[h.length - 1] : null; };
    const members = [...history.keys()].filter((pk) => state(pk).member);
    const at = (pk, ts) => { let s = null; for (const x of history.get(pk) || []) { if (x.at <= ts) s = x; } return s; };
    const roster = {
      members, history, roles: Object.fromEntries(members.map((pk) => [pk, state(pk).role])),
      roleOf(pk) { const s = state(pk); return s && s.member ? s.role : null; },
      memberAt(pk, ts) { const s = at(pk, ts); return !!(s && s.member); },
      /** a read-write member when it wrote: a read-only or write-only member's message is held at the gate */
      writerAt(pk, ts) { const s = at(pk, ts); return !!(s && s.member && s.role === 'read-write'); },
      why(pk, ts) { const h = history.get(pk) || []; if (!h.length) return 'not a member of this topic'; const s = at(pk, ts); if (!s) return 'written before this key was granted'; if (s.member) return `written by a ${s.role} member`; return 'written after this key was revoked'; },
    };
    const declined = new Set(groupEvents.filter((e) => e.kind === KIND.DELETE_EVENT && admins.has(e.pubkey) && firstTag(e, 'h') === topic).flatMap((e) => tagValues(e, 'e')));
    const requests = order(groupEvents.filter((e) => e.kind === KIND.JOIN_REQUEST && firstTag(e, 'h') === topic))
      .filter((e) => !declined.has(e.id) && !(state(e.pubkey) && state(e.pubkey).member) && !((history.get(e.pubkey) || []).some((s) => s.at >= e.created_at)))
      .map((e) => ({ id: e.id, pubkey: e.pubkey, created_at: e.created_at, reason: e.content, code: firstTag(e, 'code') || null, ticket: firstTag(e, 'ticket') || null }));
    const rings = keyrings.filter((k) => k.topic === topic && (admins.has(k.granter) || k.granter === me));
    const byEpoch = new Map();
    for (const k of [...rings].sort((a, b) => a.created_at - b.created_at)) for (const e of k.epochs) {
      if (!byEpoch.has(e.n)) byEpoch.set(e.n, []);
      if (!byEpoch.get(e.n).some((x) => x.key === e.key)) byEpoch.get(e.n).push({ n: e.n, key: e.key, granter: k.granter, at: k.created_at });
    }
    const epochs = [...byEpoch.values()].flat();
    const conflicts = [...byEpoch].filter(([, ks]) => ks.length > 1).map(([n]) => n);
    const current = epochs.length ? Math.max(...epochs.map((e) => e.n)) : null;
    const named = rings.length ? rings[rings.length - 1].name : topic;
    return { kind: 'topic', campaign: trust.campaign, group: topic, trust, epochs, current, conflicts, admins, creator, roster,
      requests, name: named, first: epochs.length ? Math.min(...epochs.map((e) => e.n)) : null, ignoredRings: keyrings.filter((k) => k.topic === topic && !rings.includes(k)) };
  }
  const isMember = (scope, pk) => scope.kind === 'root' || scope.roster.members.includes(pk);

  // ------------------------------------------- the kind 4410 agent-mailbox envelope
  /** Mail for `reader` in `owner`'s mailbox part (the agent-mailbox wire, shared with the
      CLI's `mail send` / `mail read`). The outer 4410 is signed by the sender's member key
      and carries ["opener", pk, nonce]; `thread` is a commitment to (owner, opener, nonce,
      part), so a reader checks "this is my own thread" without local history. A root has
      msg == thread and opener == author; a reply copies the root's opener and thread and
      takes a fresh msg. The content is NIP-44 v2 (pairwise sender↔reader) of a signed 4412
      seal whose tags repeat p/mbx/part/thread/msg/reply_to and say ["k", <outer kind>]. */
  function threadCommit(owner, opener, nonce, part) {
    return hex(sha256(concat(utf8('agent-mailbox/thread/v1'), unhex(owner), unhex(opener), unhex(nonce), utf8(part))).subarray(0, 16));
  }
  function mailTags({ owner, reader, part, opener, thread, msg, campaign, replyTo, blobs }) {
    const tags = [['mbx', owner], ['p', reader], ['part', part], ['thread', thread], ['msg', msg], ['t', `${campaign}:${DROPBOX}`], ['opener', opener.pubkey, opener.nonce]];
    if (replyTo) tags.push(['reply_to', replyTo]);
    for (const b of blobs || []) tags.push(['blob', b]);
    return tags;
  }
  function openerOf(ev) {
    const t = ev.tags.find((x) => x[0] === 'opener');
    if (!t || t.length < 3 || !HEX64.test(t[1]) || !HEX32.test(t[2])) throw new NMError('mail carries no well-formed ["opener", pubkey, nonce] tag');
    return { pubkey: t[1], nonce: t[2] };
  }
  function checkThread(ev) {
    const owner = firstTag(ev, 'mbx'), part = firstTag(ev, 'part'), thread = firstTag(ev, 'thread'), msg = firstTag(ev, 'msg');
    if (!owner || !HEX64.test(owner) || !part || !thread || !HEX32.test(thread) || !msg || !HEX32.test(msg)) throw new NMError('mail routing tags (mbx, part, thread, msg) are missing or malformed');
    const opener = openerOf(ev);
    if (threadCommit(owner, opener.pubkey, opener.nonce, part) !== thread) throw new NMError('the thread does not match its opener commitment');
    if (!firstTag(ev, 'reply_to') && (msg !== thread || ev.pubkey !== opener.pubkey)) throw new NMError('a thread root must have msg == thread and be written by its opener');
    return opener;
  }
  async function sealMail(signer, outerKind, route, content) {
    const sealTags = route.filter((t) => ['p', 'mbx', 'part', 'thread', 'msg', 'reply_to'].includes(t[0])).concat([['k', String(outerKind)]]);
    const seal = await signer.signEvent({ kind: KIND.MAIL_SEAL, tags: sealTags, content: JSON.stringify(content), created_at: nowS() });
    const reader = route.find((t) => t[0] === 'p')[1];
    return signer.signEvent({ kind: outerKind, tags: route, content: await signer.nip44Encrypt(reader, JSON.stringify(seal)), created_at: nowS() });
  }
  /** A new thread when `inReplyTo` is absent, else a reply inside that mail's thread. */
  async function buildMail(signer, { owner, reader, part, campaign, subject, body, attachments, inReplyTo }) {
    if (typeof part !== 'string' || part.length > 128 || !MAIL_PART.test(part)) throw new NMError(`mailbox part ${part} must be inbox, bus or topic:<slug>`);
    text(body, 'mail body');
    const me = await signer.getPublicKey();
    let opener, thread, msg = hex(randomBytes(16)), replyTo = null;
    if (inReplyTo) {
      opener = openerOf(inReplyTo); thread = firstTag(inReplyTo, 'thread'); replyTo = firstTag(inReplyTo, 'msg');
      if (firstTag(inReplyTo, 'mbx') !== owner || firstTag(inReplyTo, 'part') !== part) throw new NMError('a reply stays in the mailbox part of the mail it answers');
    } else {
      opener = { pubkey: me, nonce: hex(randomBytes(16)) };
      thread = threadCommit(owner, me, opener.nonce, part); msg = thread;
    }
    const route = mailTags({ owner, reader, part, opener, thread, msg, campaign, replyTo, blobs: (attachments || []).map((a) => a.blob) });
    return sealMail(signer, KIND.MAIL, route, { v: 1, subject: subject || null, body, attachments: attachments || [] });
  }
  async function buildReceipt(signer, mail, { status, note, campaign }) {
    if (!['received', 'resolved', 'declined'].includes(status)) throw new NMError(`receipt status ${status} must be received, resolved or declined`);
    const ref = firstTag(mail, 'msg');
    const route = mailTags({ owner: firstTag(mail, 'mbx'), reader: mail.pubkey, part: firstTag(mail, 'part'), opener: openerOf(mail), thread: firstTag(mail, 'thread'), msg: hex(randomBytes(16)), campaign, replyTo: ref });
    return sealMail(signer, KIND.MAIL_RECEIPT, route, { v: 1, status, note: note || '', ref });
  }
  /** Who may write into `owner`'s mailbox: per peer, the newest owner-signed 4420/4421
      (a tie goes to the revoke, then to the lower id). A grant names the relay it was made
      for and counts only there; a revoke counts wherever it was made. */
  function mailGrants(owner, events, relayName) {
    const rank = (e) => [e.created_at, e.kind === KIND.MAIL_REVOKE ? 1 : 0];
    const later = (a, b) => { const [x, y] = [rank(a), rank(b)]; return x[0] !== y[0] ? x[0] > y[0] : x[1] !== y[1] ? x[1] > y[1] : a.id < b.id; };
    const by = new Map();
    for (const e of events) {
      if (![KIND.MAIL_GRANT, KIND.MAIL_REVOKE].includes(e.kind) || e.pubkey !== owner || firstTag(e, 'mbx') !== owner) continue;
      if (e.kind === KIND.MAIL_GRANT && firstTag(e, 'relay') !== relayName) continue;
      const peer = firstTag(e, 'p'); if (!peer || !HEX64.test(peer)) continue;
      const held = by.get(peer);
      if (!held || later(e, held.event)) by.set(peer, { event: e, peer, active: e.kind === KIND.MAIL_GRANT, scope: firstTag(e, 'scope') || 'send_only', trust: firstTag(e, 'trust') || 'human_gated', read_replies: firstTag(e, 'read_replies') === 'true', parts: tagValues(e, 'part') });
    }
    return by;
  }
  function grantTags({ owner, peer, scope, trust, readReplies, parts, relay }) {
    if (!['send_only', 'topic_scoped', 'full_peer'].includes(scope)) throw new NMError(`grant scope ${scope} must be send_only, topic_scoped or full_peer`);
    if (!['human_gated', 'trusted_auto'].includes(trust)) throw new NMError(`grant trust ${trust} must be human_gated or trusted_auto`);
    return [['mbx', owner], ['p', peer], ['scope', scope], ['trust', trust], ['read_replies', readReplies ? 'true' : 'false'], ...(parts || []).map((p) => ['part', p]), ['relay', relay]];
  }
  /** Open one envelope this key can read: verify the outer event, its thread commitment
      and the seal, check the seal repeats the routing, and check a seat certificate when
      a seat signed the seal. */
  async function openMail(signer, outer) {
    const ev = verifyEvent(outer);
    if (![KIND.MAIL, KIND.MAIL_RECEIPT].includes(ev.kind)) throw new NMError(`kind ${ev.kind} is not mail`);
    checkThread(ev);
    const peer = ev.pubkey === (await signer.getPublicKey()) ? firstTag(ev, 'p') : ev.pubkey;
    let seal;
    try { seal = verifyEvent(JSON.parse(await signer.nip44Decrypt(peer, ev.content))); } catch (e) { throw new NMError(`the envelope does not open to a signed seal: ${e.message}`); }
    if (seal.kind !== KIND.MAIL_SEAL) throw new NMError(`the envelope holds kind ${seal.kind}, not a mail seal (${KIND.MAIL_SEAL})`);
    for (const name of ['p', 'mbx', 'part', 'thread', 'msg', 'reply_to']) if (JSON.stringify(tagValues(seal, name)) !== JSON.stringify(tagValues(ev, name))) throw new NMError(`the seal's ${name} tag does not repeat the envelope's`);
    if (firstTag(seal, 'k') !== String(ev.kind)) throw new NMError(`the seal says it belongs to kind ${firstTag(seal, 'k')}, not ${ev.kind}`);
    let signedBy = ev.pubkey, seat = null;
    if (seal.pubkey !== ev.pubkey) {
      const certText = firstTag(seal, 'seat_cert');
      if (!certText) throw new NMError('the seal is signed by another key and carries no seat certificate');
      const cert = verifyEvent(JSON.parse(certText));
      if (cert.kind !== KIND.SEAT_CERT || cert.pubkey !== ev.pubkey || firstTag(cert, 'd') !== seal.pubkey) throw new NMError('the seat certificate does not bind the seal key to the envelope key');
      signedBy = seal.pubkey; seat = { pubkey: seal.pubkey, cert };
    }
    const body = JSON.parse(seal.content);
    if (!body || body.v !== 1) throw new NMError('mail seal content is not version 1');
    if (ev.kind === KIND.MAIL_RECEIPT && body.ref !== firstTag(ev, 'reply_to')) throw new NMError('a receipt names another message than its reply_to');
    return { outer: ev, seal, body, signedBy, seat };
  }

  // ------------------------------------------------------------------------ blossom
  async function blossomAuthorization(signer, verb, sha256Hex, server, ttl = C.AUTH_TTL_S) {
    const stamp = nowS();
    const ev = await signer.signEvent({ kind: KIND.BLOSSOM_AUTH, tags: [['t', verb], ['x', sha256Hex], ['expiration', String(stamp + ttl)], ['server', server]], content: `${verb} ${sha256Hex}`, created_at: stamp });
    return 'Nostr ' + b64url(utf8(JSON.stringify(ev)));
  }
  async function blobDownload(trust, signer, sha256Hex, fetchImpl) {
    if (!HEX64.test(sha256Hex)) throw new NMError(`${sha256Hex} is not a sha256 in lowercase hex`);
    const res = await (fetchImpl || root.fetch)(`${trust.blossom_origin}/${sha256Hex}`, { headers: { Authorization: await blossomAuthorization(signer, 'get', sha256Hex, trust.blossom_server) } });
    if (res.status !== 200) throw new NMError(`GET ${trust.blossom_origin}/${sha256Hex} answered ${res.status}: ${res.headers.get('X-Reason') || res.statusText}`);
    const data = new Uint8Array(await res.arrayBuffer());
    const got = hex(sha256(data));
    if (got !== sha256Hex) throw new NMError(`${trust.blossom_origin}/${sha256Hex} returned ${data.length} bytes hashing to ${got}; discarded`, 'digest');
    return { data, type: res.headers.get('Content-Type') || 'application/octet-stream' };
  }
  async function blobUpload(trust, signer, data, contentType, fetchImpl) {
    const digestHex = hex(sha256(data));
    const res = await (fetchImpl || root.fetch)(`${trust.blossom_origin}/upload`, { method: 'PUT', body: data, headers: { 'Content-Type': contentType || 'application/octet-stream', Authorization: await blossomAuthorization(signer, 'upload', digestHex, trust.blossom_server) } });
    if (![200, 201].includes(res.status)) throw new NMError(`PUT ${trust.blossom_origin}/upload answered ${res.status}: ${res.headers.get('X-Reason') || res.statusText}`);
    const got = await res.json();
    if (!got || got.sha256 !== digestHex) throw new NMError(`${trust.blossom_origin} stored the upload under ${got && got.sha256}, not ${digestHex}`, 'digest');
    return { sha256: digestHex, size: data.length, url: got.url || `${trust.blossom_origin}/${digestHex}`, type: got.type || contentType };
  }
  /** backend.CampaignSession.open_sealed_blob: the stored bytes are NIP-44 v2 as ASCII,
      tried under every epoch key the scope holds, newest first (the MAC decides). The
      refusal's code is the bridge's name for the same refusal (ui.Unopened). */
  function openSealedBlob(scope, stored) {
    const held = scope.epochs.slice().sort((a, b) => b.n - a.n);
    const ns = [...new Set(held.map((e) => e.n))].sort((a, b) => a - b);
    if (stored.some((b) => b > 0x7f)) throw new NMError('the blob is not a sealed blob (not NIP-44 ASCII)', 'Unopened');
    const text = fromUtf8(stored);
    for (const e of held) {
      try { return { data: nip44DecryptBytes(text, epochConv(scope.campaign, e.key)), epoch: e.n }; } catch (err) { if (!(err instanceof NMError)) throw err; }
    }
    throw new NMError(`the blob does not open under any of the ${ns.length} epoch key(s) held here ([${ns.join(', ')}]): it was sealed in an epoch this seat was not given, or uploaded in plaintext (open it as stored)`, 'Unopened');
  }

  // ------------------------------------------------- writes: the backend.py verbs
  /** A session: one relay connection, one signer, one trust. Every write follows the
      Python backend: idempotency keys, read-back, first settlement stands. */
  class Desk {
    constructor(trust, signer, relay) { this.trust = trust; this.signer = signer; this.relay = relay; }
    get me() { return this.relay.pubkey; }
    async publishRecord(scope, kind, recordType, payload, { topic = null, tags = [], createdAt } = {}) {
      const ev = await this.relay.sign(kind, [...scopeTags(scope, topic), ...tags], encodeRecord(scope, recordType, payload), createdAt);
      const size = wireBytes(ev);
      if (size > C.MAX_EVENT_BYTES) throw new NMError(`this ${recordType} is ${size} bytes, ${Math.round((100 * size) / C.MAX_EVENT_BYTES)}% of the ${C.MAX_EVENT_BYTES}-byte campaign event cap; nothing was sent. Upload the body as a blob and send its sha256`, 'too-large');
      await this.relay.publish(ev);
      return ev;
    }
    async scopeEvents(scope, extra = {}) {
      if (scope.group) return this.relay.queryAll({ '#h': [scope.group], ...extra });
      const known = [scope.campaign, `${scope.campaign}:${BUS}`, `${scope.campaign}:${INBOX}`, `${scope.campaign}:${DROPBOX}`, ...(extra.topics || []).map((t) => `${scope.campaign}:${t}`)];
      return this.relay.queryAll({ '#t': [...new Set(known)] });
    }
    async _mine(scope, topic, key) {
      const evs = await this.relay.queryAll({ kinds: [KIND.MESSAGE], authors: [this.me], '#i': [keyTag(scope.campaign, topic, key)] });
      const out = [];
      for (const ev of evs) { try { const { payload } = decodeRecord(scope, ev, KIND.MESSAGE, 'message', topic); out.push([ev, parseMessage(scope, topic, ev, payload)]); } catch (e) { if (e.code !== 'mac') throw e; } }
      return out;
    }
    /** backend.post */
    async post(scope, topic, { body, kind = 'message', subject = '', refs = [], reply_to = null }, key) {
      slug(topic, 'topic');
      if (!String(body || '').trim()) throw new NMError('a message needs a body');
      if (!MESSAGE_KIND.test(kind)) throw new NMError(`message kind ${kind} must match ${MESSAGE_KIND.source}`);
      if (reply_to !== null && !HEX64.test(reply_to)) throw new NMError('reply_to is the id of the message answered');
      key = key || contentKey(topic, body, kind, subject, refs, reply_to);
      const said = JSON.stringify([body, kind, subject, refs, reply_to]);
      const same = (m) => JSON.stringify([m.body, m.kind, m.subject, m.refs, m.reply_to]) === said;
      const earlier = await this._mine(scope, topic, key);
      if (earlier.length) {
        if (!same(earlier[0][1])) throw new NMError(`key ${key} already carries a different message on ${topic}; nothing was sent`, 'idempotency');
        return { id: earlier[0][0].id, duplicate: true, detail: 'already posted under this key', bytes_used: wireBytes(earlier[0][0]) };
      }
      const tags = [['i', keyTag(scope.campaign, topic, key)], ...(reply_to ? [['e', reply_to]] : [])];
      const sent = await this.publishRecord(scope, KIND.MESSAGE, 'message', { body, kind, subject, refs, reply_to, key }, { topic, tags });
      const standing = await this._mine(scope, topic, key);
      const first = standing.length ? standing[0] : [sent];
      if (first[0].id === sent.id) return { id: sent.id, duplicate: false, bytes_used: wireBytes(sent), epoch: scope.current };
      if (!same(first[1])) throw new NMError(`key ${key} was used at the same moment for a different message on ${topic}; the earlier one stands`, 'idempotency');
      return { id: first[0].id, duplicate: true, detail: 'another writer with this key published first', bytes_used: wireBytes(first[0]) };
    }
    /** backend.ack over a built view: the first settlement this seat made stands. */
    async ack(scope, view, topic, seat, msgId, { disposition = 'handled', result_ref = null, note = null } = {}) {
      slug(seat, 'seat');
      if (!DISPOSITIONS.includes(disposition)) throw new NMError(`disposition ${disposition} must be one of ${DISPOSITIONS}`);
      if (topic === INBOX && TERMINAL.includes(disposition)) {
        if (disposition === 'handled' && !result_ref) throw new NMError('a handled inbox pointer needs result_ref: the PR, commit or issue that absorbed it');
        if (disposition !== 'handled' && !(result_ref || note)) throw new NMError(`an inbox pointer marked ${disposition} needs a note or a result_ref saying why`);
      }
      const tv = view.topics[topic] || { alias: new Map(), acks: [] };
      const target = tv.alias.get(msgId) || msgId;
      const recorded = tv.acks.find((a) => a.author === this.me && a.seat === seat && a.msg_id === target && settles(topic, a));
      if (recorded) return { id: recorded.id, duplicate: true, detail: 'already settled by this seat', disposition: recorded.disposition, result_ref: recorded.result_ref || null };
      const ackScope = this._epochFor(scope, view, target);
      const ev = await this.publishRecord(ackScope, KIND.ACK, 'ack', { seat, msg_id: target, disposition, result_ref, note }, { topic, tags: [['e', target]] });
      return { id: ev.id, duplicate: false, disposition, result_ref, epoch: ackScope.current };
    }
    /** An ack or ruling is written in the epoch of the message it names, so whoever can
        read that message can read what was decided about it. */
    _epochFor(scope, view, msgId) {
      const n = view && view.epochOf.get(msgId);
      return n && scope.kind === 'topic' && n !== scope.current ? { ...scope, current: n } : scope;
    }
    async todo(scope, view, note, { target, surface, doc, page, refs = [], subject = '' }, key) {
      const tagged = [`target:${slug(target, 'target')}`, ...[['surface', surface], ['doc', doc], ['page', page]].filter(([, v]) => v).map(([n, v]) => `${n}:${v}`)];
      const all = [...new Set([...tagged, ...refs])];
      key = key || contentKey(INBOX, note, subject, target, surface || null, doc || null, page || null, refs);
      return this.post(scope, INBOX, { body: note, kind: 'todo', subject, refs: all }, key);
    }
    async gate(scope, view, topic, msgId, approve, note) {
      if (!scope.admins.has(this.me)) throw new NMError('only an admin of this topic rules on held messages; nothing was sent', 'not-authorized');
      return this.ack(scope, view, topic, GATE_SEAT, msgId, { disposition: approve ? 'handled' : 'rejected', note: note || (approve ? 'released from quarantine' : 'declined at the human gate') });
    }
    // ---- learning loop
    async openCondition(scope, view, { condition, goal, statement, next_action }) {
      if (!scope.trust.reviewers.includes(this.me)) throw new NMError('a condition is opened by a reviewer or operator key of this campaign; nothing was sent', 'not-authorized');
      const c = parseCondition({ condition, rev: 1, state: 'open', goal, statement, next_action, evidence: [], rejected_routes: [], last_decision: '', last_claim: '' });
      if (view.heads.has(condition)) throw new NMError(`condition ${condition} already stands at revision ${view.heads.get(condition).rev}; a decision moves it, opening it again does not`, 'stale');
      const ev = await this.publishRecord(scope, KIND.CONDITION_HEAD, 'condition', c, { tags: [['d', address(scope, condition)]] });
      return { id: ev.id, condition: c };
    }
    async claim(scope, { condition, condition_rev, effect, candidate_digest, evidence_refs, wave = '', task = '' }, goalEvent) {
      const c = parseClaim({ tags: goalEvent ? [['e', goalEvent]] : [] }, { condition, condition_rev, effect, candidate_digest, evidence_refs, wave, task });
      const ev = await this.publishRecord(scope, KIND.CLAIM, 'claim', c, { tags: goalEvent ? [['e', goalEvent]] : [] });
      return { id: ev.id, claim: c };
    }
    /** backend.CampaignSession.decide */
    async decide(scope, view, claimId, { outcome, reason, next_action, statement = '', reopen_if = '' }) {
      if (!scope.trust.reviewers.includes(this.me)) throw new NMError('a claim is decided by a reviewer or operator key of this campaign; nothing was sent', 'not-authorized');
      const claim = view.claims.find((c) => c.id === claimId);
      if (!claim) throw new NMError(`no claim ${claimId.slice(0, 12)}… in this scope`);
      if (claim.author === this.me) throw new NMError('a claim is not reviewed by the key that made it; nothing was sent', 'not-authorized');
      const head = view.heads.get(claim.condition);
      if (!head) throw new NMError(`condition ${claim.condition} was never opened; a reviewer opens it before claims against it can be decided`);
      let decision = view.decisions.find((d) => d.claim === claimId && d.author === this.me), decisionId;
      const repeated = !!decision;
      if (decision) decisionId = decision.id;
      else {
        if (claim.condition_rev !== head.rev) throw new NMError(`the claim was made against revision ${claim.condition_rev} of ${claim.condition}, which now stands at revision ${head.rev}. The claimant submits again against what is open now; nothing was written`, 'stale');
        if (outcome === 'accepted' && claim.effect === 'narrows' && !statement.trim()) throw new NMError('accepting a claim that narrows the condition needs the narrowed statement');
        decision = { claim: claimId, condition: claim.condition, condition_rev: head.rev, outcome, reason, next_action, statement, reopen_if, candidate_digest: claim.candidate_digest };
        checkDecision(decision);
        decisionId = (await this.publishRecord(scope, KIND.DECISION, 'decision', decision, { tags: [['e', claimId]] })).id;
      }
      if (head.last_decision === decisionId) return { decision, condition: head, repeated: true };
      if (head.rev !== decision.condition_rev) throw new NMError(`the ruling was made at revision ${decision.condition_rev} of ${claim.condition}, and the condition has since moved to revision ${head.rev} without it. Reconcile by hand`, 'stale');
      const moved = conditionAfter(head, claim, decision, decisionId);
      const mineHeld = head.reviewer === this.me ? head.event.created_at : 0;
      const ev = await this.publishRecord(scope, KIND.CONDITION_HEAD, 'condition', moved, { tags: [['d', address(scope, moved.condition)]], createdAt: Math.max(nowS(), mineHeld + 1) });
      const back = await this.relay.queryAll({ kinds: [KIND.CONDITION_HEAD], authors: [this.me], '#d': [address(scope, moved.condition)] });
      const won = newest(back.map((e) => ({ event: e })));
      if (!won || won.event.id !== ev.id) throw new NMError(`this condition head was sent, but another writer using this key holds the slot (${won ? won.event.id.slice(0, 12) + '…' : 'nothing readable'})`, 'stale');
      return { decision, condition: moved, repeated };
    }
    async handoff(scope, packet, forSeat) {
      checkHandoff(packet);
      const payload = Object.fromEntries(HANDOFF_FIELDS.map(([k]) => [k, packet[k]]));
      if (forSeat) payload.for_seat = slug(forSeat, 'seat');
      return (await this.publishRecord(scope, KIND.HANDOFF, 'handoff', payload)).id;
    }
    // ---- blobs
    /** cli.cmd_blob_put: inside a topic the bytes are sealed under its current epoch and
        uploaded as ASCII (CampaignSession.put_sealed_blob); the root campaign's go up as
        they are. Through the bridge, the bridge does it. */
    async putBlob(scope, data, contentType) {

      if (taken.length) throw new NMError(`topic ${topic} already exists (created by ${npub(order(taken)[0].pubkey)})`, 'exists');

      if (role !== 'write-only' && !['full_history', 'forward_only'].includes(mode)) throw new NMError(`grant mode ${mode} must be full_history or forward_only`);

      await this.relay.publish(put);

        Object.assign(out, { mode: null, mailbox: { owner: npub(this.me), part, scope: 'topic_scoped', trust: 'human_gated' } });
        if (held && held !== 'write-only') Object.assign(out, await this.rotate(scope, { remove: member }));   // it held keys until now

        const wrap = await this._ring(member, scope.group, scope.name, scope.epochs, scope.current, 'full_history');

    async revoke(scope, member) {
      this._admin(scope);
      member = pubkeyHex(member);
      if (member === scope.creator) throw new NMError('the creator of a topic is its admin and is not removed from it');
      const rm = await this.relay.sign(KIND.REMOVE_USER, [['h', scope.group], ['p', member]], '');
      await this.relay.publish(rm);
      return { remove_user: rm.id, ...(await this.rotate(scope, { remove: member })) };
    }
    async rotate(scope, { add = null, remove = null } = {}) {
      const n = (scope.current || 0) + 1, fresh = { n, key: hex(randomBytes(32)) };
      const members = new Set(scope.roster.members.filter((pk) => scope.roster.roleOf(pk) !== 'write-only')); members.add(this.me);
      if (add) members.add(add);
      if (remove) members.delete(remove);
      const wraps = [];
      for (const pk of [...members].sort()) {
        const ring = pk === this.me ? [...scope.epochs, fresh] : [fresh];
        wraps.push(await this._ring(pk, scope.group, scope.name, ring, n, pk === add ? 'forward_only' : 'rotate'));
      }
      return { epoch: n, recipients: [...members].sort(), wraps };
    }
    async requestAccess(topic, reason, code, ticket, proof = null) {
      const tags = [['h', topic], ...(code ? [['code', code]] : []), ...(ticket ? [['ticket', ticket]] : []), ...(proof ? [['proof', proof]] : [])];
      const ev = await this.relay.sign(KIND.JOIN_REQUEST, tags, reason || '');
      await this.relay.publish(ev);
      return ev.id;
    }
    async decline(scope, requestId) {
      this._admin(scope);
      const ev = await this.relay.sign(KIND.DELETE_EVENT, [['h', scope.group], ['e', requestId]], '');
      await this.relay.publish(ev);
      return ev.id;
    }
    /** Every key ring and mailbox envelope addressed to this key, opened. */
    async inbox() {
      const wraps = await this.relay.queryAll({ kinds: [KIND.GIFT_WRAP], '#p': [this.me] });
      const keyrings = [], rejected = [];
      for (const w of wraps) {
        try { const { rumor } = await unwrapGift(this.signer, w); if (rumor.kind === KIND.KEYRING) keyrings.push({ ...parseKeyring(rumor, this.trust.campaign), wrap: w.id }); }
        catch (e) { rejected.push({ id: w.id, reason: `gift wrap: ${e.message}` }); }
      }
      return { keyrings, rejected };
    }
    async profile(handle) {
      const ev = await this.relay.sign(KIND.PROFILE, [], JSON.stringify({ name: handle, display_name: handle }));
      await this.relay.publish(ev);
      return ev.id;
    }
    // ---- mailbox (4410)
    async grantMail(peer, { scope = 'send_only', trust = 'human_gated', readReplies = false, parts = ['inbox'] } = {}) {
      const ev = await this.relay.sign(KIND.MAIL_GRANT, grantTags({ owner: this.me, peer: pubkeyHex(peer), scope, trust, readReplies, parts, relay: this.trust.relay_auth_url || this.trust.relay }), '');
      await this.relay.publish(ev);
      return ev.id;
    }
    async revokeMail(peer) {
      const ev = await this.relay.sign(KIND.MAIL_REVOKE, [['mbx', this.me], ['p', pubkeyHex(peer)]], '');
      await this.relay.publish(ev);
      return ev.id;
    }
    async sendMail({ owner, part = 'inbox', subject, body, inReplyTo, reader }) {
      owner = pubkeyHex(owner);
      const ev = await buildMail(this.signer, { owner, reader: reader ? pubkeyHex(reader) : owner, part, campaign: this.trust.campaign, subject, body, inReplyTo });
      await this.relay.publish(ev);
      return ev.id;
    }
    /** The owner's mailbox: who may write, what arrived, what the human gate holds. Mail
        from a key with no owner-signed grant is never decrypted. */
    async mailbox(rootView) {
      const me = this.me;
      const grantsEv = await this.relay.queryAll({ kinds: [KIND.MAIL_GRANT, KIND.MAIL_REVOKE], authors: [me] });
      const grants = mailGrants(me, grantsEv, this.trust.relay_auth_url || this.trust.relay);
      const incoming = await this.relay.queryAll({ kinds: [KIND.MAIL, KIND.MAIL_RECEIPT], '#p': [me] });
      const sent = await this.relay.queryAll({ kinds: [KIND.MAIL, KIND.MAIL_RECEIPT], authors: [me] });

        const meta = { id: ev.id, kind: ev.kind, from: ev.pubkey, to: firstTag(ev, 'p'), owner: firstTag(ev, 'mbx'), part: firstTag(ev, 'part'), thread: firstTag(ev, 'thread'), msg: firstTag(ev, 'msg'), reply_to: firstTag(ev, 'reply_to') || null, created_at: ev.created_at, outgoing: fromMe, outer: ev };
        const ownMailbox = meta.owner === me;

        let opened;
        try { opened = await openMail(this.signer, ev); } catch (e) { rejected.push({ id: ev.id, reason: `mail: ${e.message}` }); continue; }

          const ruling = gate.get(ev.id);

    }

      return this.ack(rootScope, rootView, DROPBOX, GATE_SEAT, mailId, { disposition: approve ? 'handled' : 'rejected', note: note || (approve ? 'released from quarantine' : 'declined at the human gate') });

<script id="nm-app">
/* The console itself: onboarding, topics, the campaign stream, access control, the

(function () {
  'use strict';
  const NM = window.NM;
  const STORE = 'nm.console.v1', LINK = 'nm.console.link', THEME = 'nm.console.theme';

  // --------------------------------------------------------------- safe markup
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  const $ = (sel, el = document) => el.querySelector(sel);

  // --------------------------------------------------------------------- state
  const S = {
    mode: 'standalone', bridge: null, store: {}, link: {}, chapter: 'switchboard', harness: 'Claude Code', signingIn: false,
    signer: null, trust: null, relay: null, desk: null, me: null, status: 'idle',
    keyrings: [], scopes: new Map(), views: new Map(), access: new Map(), primary: null,
    mailbox: null, profiles: new Map(), selected: null, tab: 'bus', busTopic: 'bus', kindFilter: '',
    replyTo: null, errors: [], toasts: [], modal: null, live: [], refreshing: false, dirty: false,
    rejected: [], invites: { topics: {} }, mayweSent: null, gen: 0,
  };
  /** The crosswire.sh invite waitlist runs on MayWe (maywe.email). Its public
      /v1/subscribe takes a publishable key only from the one origin the key was issued
      for, so the form is drawn on those origins alone; anywhere else (a workstation's
      `nostr-mailbox ui`, an organization's own relay) it could only be refused. */
  const MAYWE_SUBSCRIBE_URL = 'https://newsletter.awow.io/v1/subscribe';
  const MAYWE_KEYS = Object.freeze({
    'https://crosswire.sh': 'pk_G-LEI15eUfTnYhGyV2hMHvRsxMsJwkM4r-wgj3jS2jI',
    'https://docs.awow.io': 'pk_6ZNZP0jBeKTpu22jfUQfQ6Dhcu6faq7iSzeEJsMMy78',
  });
  const mayweKey = () => MAYWE_KEYS[location.origin] || null;
  function report(err, context) {
    console.error(context || 'nostr-mailbox console', err);
    S.errors.push({ id: NM.hex(NM.randomBytes(4)), text: `${context ? context + ': ' : ''}${err && err.message ? err.message : err}` });
    draw();
  }
  function toast(text) {
    const t = { id: NM.hex(NM.randomBytes(4)), text };
    S.toasts.push(t); drawToasts();
    setTimeout(() => { S.toasts = S.toasts.filter((x) => x !== t); drawToasts(); }, 4000);
  }
  function readStore() {
    const text = localStorage.getItem(STORE) || sessionStorage.getItem(STORE);

  }

      sent to a server, and now it is not in the history either. */

    const frag = location.hash.replace(/^#/, '');

      try { link = NM.parseLink(frag); } catch (e) { if (!(e instanceof NM.NMError)) throw e; report(e, 'this invite link was not used'); return {}; }
      sessionStorage.setItem(LINK, JSON.stringify(link));
      return link;
    }
    const kept = sessionStorage.getItem(LINK);
    if (!kept) return {};

  }

  async function api(path, body) {
    const init = { method: body === undefined ? 'GET' : 'POST', headers: NM.bridgeHeaders(S.bridge.token, S.bridge.persona) };
    if (body !== undefined) { init.body = JSON.stringify(body); init.headers['Content-Type'] = 'application/json'; }

  // --------------------------------------------------------------------- names
  const short = (pk) => { const n = NM.npub(pk); return `${n.slice(0, 10)}…${n.slice(-4)}`; };
  const who = (pk) => S.profiles.get(pk) || short(pk);
  function seatBadges(pk, scope) {
    const t = S.trust, b = [];
    if (t.operator_pubkeys.includes(pk)) b.push(html`<span class="badge terra">operator</span>`);
    else if (t.reviewer_pubkeys.includes(pk)) b.push(html`<span class="badge plum">reviewer</span>`);
    else if (t.lead_pubkeys.includes(pk)) b.push(html`<span class="badge amber">lead</span>`);
    if (scope && scope.kind === 'topic') {
      if (scope.creator === pk) b.push(html`<span class="badge teal">admin</span>`);
      else if (scope.roster.members.includes(pk)) b.push(roleBadge(scope.roster.roleOf(pk)));
    }
    if (pk === S.me) b.push(html`<span class="badge sage">you</span>`);
    return b;
  }
  const ROLE_NOTE = {
    'read-write': 'reads every epoch it was given and writes to the stream',
    'read-only': 'given the key ring; what it posts is held at the human gate',
    'write-only': 'never given the key ring; it writes sealed mail to the admin',

  const roleBadge = (role) => html`<span class="badge ${role === 'read-only' ? 'amber' : role === 'write-only' ? 'plum' : ''}" title="${ROLE_NOTE[role] || ''}">${role}</span>`;
  /** What the topic header says about a channel: how its payloads are protected, what this
      key may do in it, and whether a coding agent on this workstation holds its key. */
  function scopeBadges(scope) {
    const b = [scope.current
      ? html`<span class="badge teal" title="records are NIP-44 v2 under the epoch key; the relay stores ciphertext">🔒 end-to-end encrypted · Epoch ${scope.current}${scope.first && scope.first > 1 ? ` · history from E${scope.first}` : ''}</span>`

    if (scope.kind === 'topic') {
      const mine = scope.admins.has(S.me) ? null : scope.roster.roleOf(S.me);
      b.push(scope.admins.has(S.me) ? html`<span class="badge teal">you: admin</span>` : mine ? html`<span class="badge" title="${ROLE_NOTE[mine]}">you: ${mine}</span>` : html`<span class="badge plum">you: not a member</span>`);

      else if ((S.bridge.state.export_errors || {})[scope.group]) b.push(html`<span class="badge plum" title="${S.bridge.state.export_errors[scope.group]}">agent keyring unreadable</span>`);
      else if (held.length) b.push(html`<span class="badge amber" title="this persona's CLI keyring on this workstation holds these epochs (Pair Coding Agent, or a CLI join): a coding agent here reads them">agent-assisted · epoch ${held.join(', ')} held here</span>`);
      else b.push(html`<span class="badge sage" title="no coding agent on this workstation was given this topic's key; agents elsewhere are not known here">human-only on this workstation</span>`);
    }
    return b;
  }
  const verified = () => html`<span class="badge sage" title="id recomputed and BIP-340 Schnorr signature verified in this tab">✓ signed</span>`;
  const epochBadge = (n) => (n ? html`<span class="badge teal" title="decrypted with epoch ${n} of the key ring">E${n}</span>` : '');
  function ago(ts) {
    const s = NM.nowS() - ts, iso = NM.isoStamp(ts);
    const t = s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
    return html`<time datetime="${iso}" title="${iso}">${t}</time>`;
  }
  const seatSlug = (text) => (String(text || '').toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^[^a-z0-9]+/, '').slice(0, 64) || 'console');

  // ------------------------------------------------------------------- boot
  /** A theme chosen with ◐ is kept on this device; with none chosen, the system's
      preference decides (the stylesheet's prefers-color-scheme block). */
  function applyTheme() {
    const kept = localStorage.getItem(THEME);
    if (kept === 'light' || kept === 'dark') document.documentElement.dataset.theme = kept;
    else delete document.documentElement.dataset.theme;

    const token = $('meta[name="nm-bridge"]').getAttribute('content');
    if (token) {
      S.mode = 'bridge'; S.bridge = { token, persona: null, state: null };
      S.bridge.state = await api('/api/state');       // names no persona: the console's default
      const st = S.bridge.state;
      S.bridge.persona = st.active_persona;           // this tab's from now on
      S.store = { seat: st.seat, handle: st.seat };
      if (st.identity && st.trust) {
        S.signer = new NM.BridgeSigner('', token, S.bridge.persona);
        S.trust = NM.makeTrust(st.trust);
      }

      S.store = readStore();
      if (S.store.nsec) S.signer = new NM.KeySigner(NM.bech32Decode('nsec', S.store.nsec));
      else if (S.store.signer === 'nip07' && window.nostr) S.signer = new NM.Nip07Signer(window.nostr);

  // the relay ends that subscription on eviction, even when no room is selected.

      liveSignature: null, keyrings: [], views: new Map(), scopes: new Map(), access: new Map(),
      mailbox: null, profiles: new Map(), selected: null, modal: null, pair: null,
      minted: null, invites: { topics: {} }, rejected: [], errors: [], toasts: [], replyTo: null, dirty: false });

  }

  async function privateRelay() {
    if (S.mode === 'bridge') return (await api('/api/relay-info')).advertises_private;
    const url = new URL(S.trust.relay);
    url.protocol = url.protocol === 'wss:' ? 'https:' : 'http:';
    const response = await fetch(url, { headers: { Accept: 'application/nostr+json' },
      credentials: 'omit', redirect: 'error', cache: 'no-store',
      signal: AbortSignal.timeout(NM.C.DEFAULT_WAIT_S * 1000) });
    if (!response.ok) throw new NM.NMError(`Relay information request failed (HTTP ${response.status})`);
    const { limitation } = await response.json();
    return limitation?.auth_required === true && limitation?.membership_required === true;
  }

  async function connect(invite = null, member = '') {
    disconnect();
    const relay = new NM.RelayClient(S.trust.relay, S.signer, { authUrl: S.trust.relay_auth_url || S.trust.relay,
      onState(state, err) {
        if (S.relay === relay && (state === 'closed' || state === 'failed')) lost(err);
      } });
    function lost(err) {
      if (S.relay !== relay) return;
      disconnect();
      report(err, 'Session locked');
    }
    S.relay = relay; S.status = 'connecting'; draw();
    try {
      if (!await privateRelay()) throw new NM.NMError('The relay must advertise both auth_required and membership_required in NIP-11.');
      if (S.relay !== relay) return;
      await relay.connect();
      if (invite) {
        const receipt = relay.pubkey + '.' + NM.hex(NM.sha256(NM.utf8(S.link.join)));
        if (S.store.redeemed !== receipt) {
          await relay.join(invite.code);
          S.store.redeemed = receipt;
        }
        // Preserve this identity and the original link if group admission or a later
        // read fails. The receipt skips only the spent claim, never the membership probe.
        if (S.store.trust?.relay !== invite.trust.relay || S.store.trust?.campaign !== invite.trust.campaign) {
          S.store.tokenRings = []; S.store.requested = [];
        }
        S.store.trust = invite.bundle;
        S.store.pubkey = relay.pubkey;
        saveStore();
      }
      await relay.subscribeLive({ kinds: [NM.KIND.HEARTBEAT] }, () => {}, lost);
      if (S.relay !== relay) return;
      S.me = relay.pubkey;
      if (S.mode === 'standalone') { S.store.pubkey = S.me; saveStore(); }
      S.status = 'ready';
      S.desk = new NM.Desk(S.trust, S.signer, relay);
    } catch (e) {
      if (S.relay === relay) disconnect();
      throw e;
    }
    draw();
    try {
      if (S.mode === 'standalone' && S.store.trust && (S.signer.type === 'browser' || S.signer.ext?.nip44)) {
        const key = declarationKey(S.me, S.trust);
        const sealed = await S.signer.nip44Encrypt(S.me, JSON.stringify(S.store.trust));
        localStorage.setItem(key, sealed);
      }
      if (invite && S.relay === relay) {
        await finishInvite(invite, member);
        if (S.relay !== relay) return;
        delete S.store.redeemed;
        saveStore(); forgetLink('join');
      }
    } finally {
      if (S.relay === relay) await refresh();
    }
  }

  const declarationKey = (pk, t) => 'nm.declaration.' + JSON.stringify([pk, t.relay, t.campaign]);
  // ----------------------------------------------------------------- loading
  function tokenRings() {
    return (S.store.tokenRings || []).map((r) => ({ topic: r.topic, name: r.name || r.topic, epochs: Object.entries(r.epochs).map(([n, key]) => ({ n: Number(n), key })), current: r.current, granter: r.owner, created_at: r.at, mode: 'token' }));
  }
  /** One read at a time; an arrival during a read asks for another. A read begun for a
      persona the console has since switched away from is dropped, whatever it found:
      its connection was closed on purpose. */
  async function refresh() {
    if (!S.desk) return;
    if (S.refreshing) { S.dirty = true; return; }
    S.refreshing = true;
    try {
      do {
        S.dirty = false;
        const gen = S.gen;
        try { await load(gen); } catch (e) {
          if (gen === S.gen) throw e;
          console.info('a read for the previous persona ended with its connection', e);
        }
      } while (S.dirty);
    } catch (e) { report(e, 'reading the relay'); }
    finally { S.refreshing = false; draw(); }
  }
  async function load(gen) {
    const desk = S.desk, trust = S.trust, stale = () => gen !== S.gen;
    const { keyrings, rejected } = await desk.inbox();
    if (stale()) return;
    if (S.mode === 'bridge') {
      const invites = await api('/api/invites');
      if (stale()) return;
      S.invites = invites;
    }
    S.keyrings = [...keyrings, ...tokenRings()];
    S.rejected = rejected;
    const created = await S.relay.queryAll({ kinds: [NM.KIND.CREATE_GROUP], authors: [S.me] });
    const ids = new Set([...S.keyrings.map((k) => k.topic), ...created.flatMap((e) => NM.tagValues(e, 'h')).filter((t) => NM.TOPIC_ID.test(t)), ...((S.store.requested || []).map((r) => r.topic))]);
    if (trust.keyring) ids.add(trust.keyring);
    if (S.link.topic && NM.TOPIC_ID.test(S.link.topic)) ids.add(S.link.topic);
    const scopes = new Map(), views = new Map(), access = new Map(), authors = new Set();
    if (!trust.keyring && trust.operator_pubkeys.length) {
      const root = NM.rootScope(trust);
      const evs = await desk.scopeEvents(root);
      scopes.set('', root); views.set('', NM.buildView(root, evs));
      evs.forEach((e) => authors.add(e.pubkey));
    }
    for (const id of [...ids].sort()) {
      let evs;
      try { evs = await S.relay.queryAll({ '#h': [id] }); }
      catch (e) { if (e instanceof NM.RelayRejected) { access.set(id, e.reason); continue; } throw e; }
      const scope = NM.topicScope(trust, id, evs, S.keyrings, S.me);
      scopes.set(id, scope); evs.forEach((e) => authors.add(e.pubkey));
      if (scope.epochs.length) views.set(id, NM.buildView(scope, evs));
      else access.set(id, scope.roster.roleOf(S.me) === 'write-only' ? 'write-only: this key is never given the key ring; what it writes goes sealed to the admin' : scope.roster.members.includes(S.me) ? 'a member, but no key ring has reached this key yet' : 'no key for this topic: request access, or wait for an admin to approve');
    }
    if (stale()) return;
    S.scopes = scopes; S.views = views; S.access = access;
    S.primary = trust.keyring ? trust.keyring : '';
    const primaryView = views.get(S.primary) || null;
    const mailbox = await desk.mailbox(primaryView);
    if (stale()) return;
    S.mailbox = mailbox;
    [...S.mailbox.items, ...S.mailbox.held].forEach((m) => authors.add(m.from));
    authors.add(S.me);
    await loadProfiles([...authors]);
    if (stale()) return;
    S.seen = authors.size;
    S.loaded = true;
    if (!S.selected || (S.selected.kind === 'scope' && !scopes.has(S.selected.id) && !access.has(S.selected.id))) {
      const want = S.link.topic && (scopes.has(S.link.topic) || access.has(S.link.topic)) ? S.link.topic : (scopes.has(S.primary) ? S.primary : [...scopes.keys()][0]);
      S.selected = want === undefined ? { kind: 'mail', part: 'inbox' } : { kind: 'scope', id: want };
    }
    await relive();
  }
  async function loadProfiles(pks) {
    const missing = pks.filter((pk) => !S.profiles.has(pk));
    if (!missing.length) return;
    for (const ev of await S.relay.queryAll({ kinds: [NM.KIND.PROFILE], authors: missing })) {
      let body;
      try { body = JSON.parse(ev.content); } catch (e) { S.rejected.push({ id: ev.id, reason: `profile: content is not JSON (${e.message})` }); continue; }
      if (body && typeof body.name === 'string' && body.name.trim()) S.profiles.set(ev.pubkey, body.name.trim());
    }
  }
  /** One live tail for the topics, one for the root campaign's routes, one for this key's
      wraps and mail; any arrival rereads. The tails are reopened only when the set of
      topics changed, and the new ones open before the old ones close, so nothing that
      arrives in between goes unseen. */
  async function relive() {
    const c = S.trust.campaign;
    const groups = [...S.scopes.values()].filter((s) => s.group).map((s) => s.group).sort();
    const filters = [];
    if (groups.length) filters.push({ '#h': groups });
    if (S.scopes.has('') && !S.scopes.get('').group) filters.push({ '#t': [c, `${c}:bus`, `${c}:inbox`, `${c}:dropbox`] });
    filters.push({ kinds: [NM.KIND.GIFT_WRAP, NM.KIND.MAIL, NM.KIND.MAIL_RECEIPT], '#p': [S.me] });
    const signature = JSON.stringify(filters);
    if (signature === S.liveSignature && S.live.length) return;
    const again = () => refresh();
    // a CLOSED from the relay is reported; a dropped connection shows in the status bar
    const closed = (err) => { if (err instanceof NM.RelayRejected) report(err, 'the relay ended a live subscription'); };
    const fresh = [];
    for (const f of filters) fresh.push(await S.relay.subscribeLive(f, again, closed));
    for (const l of S.live) l.close();
    S.live = fresh; S.liveSignature = signature;
  }
  // ----------------------------------------------------------------- drawing
  /** Redraw from state. What the user is typing survives: every control inside a
      [data-keep] container is read before and written back after, focus included. */
  const keyOf = (el) => el.closest('[data-keep]').dataset.keep + '.' + el.name;
  function draw() {
    const kept = {};
    for (const el of document.querySelectorAll('[data-keep] [name]')) {
      if (el.type === 'file') continue;
      if (el.type === 'radio') { if (el.checked) kept[keyOf(el)] = el.value; }
      else kept[keyOf(el)] = el.type === 'checkbox' ? el.checked : el.value;
    }
    const returningOpen = $('.returning')?.open;
    const active = document.activeElement;
    const focus = active && active.name && active.closest('[data-keep]') ? keyOf(active) : null;
    $('#app').innerHTML = out(page());
    if (returningOpen && $('.returning')) $('.returning').open = true;
    for (const el of document.querySelectorAll('[data-keep] [name]')) {
      const k = keyOf(el);
      if (el.type === 'file' || !(k in kept)) continue;
      if (el.type === 'radio') el.checked = el.value === kept[k];
      else if (el.type === 'checkbox') el.checked = kept[k];
      else el.value = kept[k];
      if (k === focus) el.focus();
    }
    drawToasts();
  }
  function drawToasts() { $('#toasts').innerHTML = out(S.toasts.map((t) => html`<div class="toast" role="status">${t.text}</div>`)); }
  function page() {
    return html`${header()}

      ${S.desk && S.store.needsBackup ? html`<div class="page backup"><div class="banner info"><span class="grow"><b>Save your browser key before signing out.</b> Download the secret key file and keep it private.</span><button class="btn primary" data-act="backup-key">Back up your nsec1… key</button></div></div>` : ''}

        S.desk && S.loaded ? html`${overview()}<div class="shell page">${sidebar()}<main id="main">${mainPanel()}</main></div>` : html`<main class="page landing">${S.desk ? html`<p role="status">Loading workspace…</p><button class="btn" data-act="refresh">Retry loading</button>` : onboarding()}</main>`}

        ${st && S.desk ? html`<label class="sr" for="hp">Persona this tab signs as</label><select id="hp" data-change="persona" title="the persona this tab signs as">${personaOptions()}</select>` : ''}

      </div></header>

  }
  /** One tabular counter per fact this tab read: rooms, personas, seats, the selected
      room's epoch, what waits at the gate, and whether an MCP server is live here. */
  function overview() {
