        <details class="returning" ${S.signer ? 'open' : ''}><summary>Returning member? Sign in with your key</summary>
          <form data-form="sign-in" data-keep="returning" class="stack">
            <label>Secret key<input name="nsec" type="password" placeholder="nsec1…" autocomplete="off" spellcheck="false"></label>
            <div class="row"><label>Relay<input name="relay" value="${saved.relay || 'wss://crosswire.sh'}" required></label>
            <label>Campaign<input name="campaign" value="${saved.campaign || 'crosswire'}" required></label></div>
            <label>Original invite for campaign keys (optional on a new device)<input name="declaration" autocomplete="off" spellcheck="false"></label>
            <div class="actions"><button class="btn primary" ${S.signingIn ? 'disabled' : ''}>Sign in${S.signer ? ' with saved key' : ' with nsec'}</button>
            <button class="btn" type="button" data-act="nip07" ${window.nostr && !S.signingIn ? '' : 'disabled'}>Use NIP-07 extension</button></div>
          </form></details>
        ${S.signingIn ? html`<p role="status">Checking relay authentication and membership…</p>` : ''}
      </section>${mayweInviteCard()}</div></div>`;
  }
  /** What an invite joins, decoded in this tab before anything is redeemed. */
  function inviteSummary(token) {
    let inv;
    try { inv = NM.decodeInviteToken(token); } catch (e) { return html`<div class="banner">This invite does not decode: ${e.message}</div>`; }
    const topic = inv.extras.topic || inv.extras.keyring || S.link.topic || null;
    return html`<dl class="kv"><dt>relay</dt><dd>${inv.trust.relay}</dd><dt>campaign</dt><dd>${inv.trust.campaign}</dd>
      ${topic ? html`<dt>topic</dt><dd>${topic}${S.link.role ? html` · invited as ${roleBadge(S.link.role)} <span class="small muted">${ROLE_NOTE[S.link.role]}; the admin's grant decides</span>` : ''}</dd>` : ''}
      <dt>operators</dt><dd>${inv.trust.operator_pubkeys.map((pk) => html`<span class="chip">${short(pk)}</span> `)}</dd>
      <dt>payloads</dt><dd>${inv.trust.campaign_key || inv.extras.epochs ? 'end-to-end encrypted (NIP-44 v2)' : inv.trust.keyring ? 'end-to-end encrypted (NIP-44 v2); this invite carries no key: the topic\'s keys reach you once an admin admits your key' : 'NOT encrypted: this campaign has no campaign_key'}</dd>
      ${inv.member ? html`<dt>invited as</dt><dd>${inv.member}</dd>` : ''}</dl>`;
  }
  /** An invite link opened on a console that already serves a campaign: redeemed for the
      active persona when it names this same campaign, refused when it names another. */
  function bridgeInviteCard() {
    const st = S.bridge.state;
    let inv;
    try { inv = NM.decodeInviteToken(S.link.join); } catch (e) { return html`<section class="banner"><span class="grow">This invite link does not decode: ${e.message}</span><button class="btn tiny ghost" data-act="link-dismiss">dismiss</button></section>`; }
    const same = inv.trust.relay === S.trust.relay && inv.trust.campaign === S.trust.campaign;
    if (!same) return html`<section class="card hero"><h2>This invite is for another campaign</h2>${inviteSummary(S.link.join)}
      <p>This console serves campaign <strong>${S.trust.campaign}</strong> on ${S.trust.relay}, from <code>${st.trust_file}</code>; joining another would replace it. Join it in a home of its own: <code>nostr-mailbox --home ~/.nostr-mailbox-${inv.trust.campaign} join &lt;token&gt;</code>, then <code>ui</code> from there.</p>
      <div class="actions"><button class="btn" data-act="copy" data-text="${S.link.join}">Copy token</button><button class="btn ghost" data-act="link-dismiss">Dismiss</button></div></section>`;
    const topic = S.link.topic || null, member = S.loaded;
    return html`<section class="card hero" data-keep="join"><h2>${topic ? `Open topic ${topic}` : 'Invite for this campaign'}</h2>${inviteSummary(S.link.join)}
      <p class="muted">${member ? html`Persona <strong>${st.active_persona}</strong> is already a member of this campaign, so the relay invite is not spent.${topic ? ' Opening the topic asks its admins for access (kind 9021), presenting the ticket from your link.' : ''}` : html`Persona <strong>${st.active_persona}</strong> is not a member yet: claiming redeems the invite for its key, and leaves <code>${st.trust_file}</code> as it is.`}</p>
      <div class="row">${member ? '' : html`<div><label for="jm">Your name (announced on the bus)</label><input id="jm" name="member" placeholder="e.g. roland"></div>`}
      <div class="fit"><button class="btn primary" data-act="${member ? 'link-topic' : 'bridge-join'}" ${member && !topic ? 'disabled' : ''}>${member ? (topic ? 'Request Access & Open Topic' : 'Nothing to redeem') : `Claim Invite as ${st.active_persona}`}</button></div>
      <div class="fit"><button class="btn ghost" data-act="link-dismiss">Dismiss</button></div></div></section>`;
  }
  /** Every persona of this workstation (`<home>/identities/*.json`): switch which one this
      tab signs as (and new tabs open with), or make a new one. */
  function personaCard() {
    const st = S.bridge.state;
    return html`<section class="card"><h3>Personas on this workstation</h3>
      <p class="small muted">Each is its own key under <code>${st.home}/identities/</code>. Switching changes who this tab signs as, and the persona new tabs open with; tabs already open keep theirs.</p>${personaPicker()}</section>`;
  }
  /** The select is drawn from state, never kept across a redraw: after a switch it shows
      the persona this tab now signs as. Only the new-name box keeps what is typed. */
  function personaOptions() {
    const st = S.bridge.state;
    return html`${st.personas.map((p) => html`<option value="${p.name}" ${p.name === st.active_persona ? 'selected' : ''} ${p.error ? 'disabled' : ''}>${p.name}${p.error ? ' · unusable: ' + p.error : ' · ' + short(p.pubkey)}</option>`)}${st.personas.some((p) => p.name === st.active_persona) ? '' : html`<option value="${st.active_persona}" selected>${st.active_persona} · no key yet</option>`}`;
  }
  function personaPicker() {
    return html`<div class="stack small"><div><label for="pp">Persona</label><select id="pp" name="persona" data-change="persona">${personaOptions()}</select></div>
      <div class="row" data-keep="persona-new"><div><label for="pn">New persona</label><input id="pn" name="new_persona" placeholder="e.g. alice-work" autocomplete="off" spellcheck="false"></div><div class="fit"><button class="btn tiny" data-act="persona-create">+ New persona</button></div></div></div>`;
  }
  // ------------------------------------------------------------------ sidebar
  function sidebar() {
    const sel = S.selected || {};
    const topicItems = [];
    for (const [id, scope] of S.scopes) {
      const view = S.views.get(id);
      if (!view) continue;
      const pending = scope.kind === 'topic' && scope.admins.has(S.me) ? scope.requests.length : 0;
      const held = view ? view.quarantine.filter((q) => !q.ruling).length : 0;
      topicItems.push(html`<li><button class="${sel.kind === 'scope' && sel.id === id ? 'on' : ''}" data-act="select" data-id="${id}">
        <span class="grow">${id === '' ? '◆ ' + scope.name : '# ' + (scope.name || id)}</span>${scope.current ? html`<span class="badge teal">E${scope.current}</span>` : scope.kind === 'root' && !scope.epochs.length ? html`<span class="badge plum" title="no campaign_key">plain</span>` : ''}
        ${pending ? html`<span class="count" title="pending join requests">${pending}</span>` : ''}${held ? html`<span class="count plum" title="held at the human gate">${held}</span>` : ''}</button></li>`);
    }
    for (const [id, why] of S.access) if (!S.views.has(id)) {
      topicItems.push(html`<li><button class="${sel.kind === 'scope' && sel.id === id ? 'on' : ''}" data-act="select" data-id="${id}" title="${why}"><span class="grow muted"># ${id}</span><span class="badge amber">no key</span></button></li>`);
    }
    const mb = S.mailbox || { items: [], held: [], grants: new Map() };
    const parts = new Set(['inbox', ...savedParts(), ...[...mb.items, ...mb.held].filter((m) => m.owner === S.me).map((m) => m.part), ...[...mb.grants.values()].flatMap((g) => g.parts)]);
    const heldMail = mb.held.filter((m) => !m.ruling).length;
    return html`<aside class="side">
      ${S.trust.operator_pubkeys.length ? '' : html`<p class="small muted">Showing personal mail and topics with keys addressed to you. Sign in with the original invite to restore campaign access on this device.</p>`}
      <div class="small muted">campaign</div><div><strong>${S.trust.campaign}</strong></div>
      <div class="small muted" title="${S.trust.relay}">${new URL(S.trust.relay).host}</div>
      <h3><span>Shared topics</span><button class="btn tiny" data-act="new-topic">+ New Topic</button></h3>
      <ul class="nav">${topicItems}</ul>
      <h3><span>Personal dropboxes</span></h3>
      <ul class="nav">${[...parts].sort().map((p) => html`<li><button class="${sel.kind === 'mail' && sel.part === p ? 'on' : ''}" data-act="select-mail" data-part="${p}"><span class="grow">@me/${p}</span>
        ${p === 'inbox' && heldMail ? html`<span class="count plum" title="held at the human gate">${heldMail}</span>` : ''}</button></li>`)}</ul>
      <h3><span>You</span></h3>
      <div class="stack small">
        <div><strong>${who(S.me)}</strong> ${seatBadges(S.me)}</div>
        <div><button class="chip" data-act="copy" data-text="${NM.npub(S.me)}" title="copy npub">${short(S.me)}</button> <span class="badge">${S.signer.type}</span></div>
        ${S.mode === 'bridge' ? personaPicker() : ''}
        <div data-keep="seat"><label for="seat">Seat for acks</label><input id="seat" name="seat" value="${S.store.seat || seatSlug(S.store.handle)}" data-change="seat"></div>
        <div class="actions"><button class="btn tiny" data-act="profile">Set handle</button>${S.mode === 'standalone' ? html`${S.signer.type === 'browser' ? html`<button class="btn tiny ghost" data-act="show-nsec">Back up key</button>` : ''}<button class="btn tiny warn" data-act="forget">Forget key</button>` : ''}</div>
        ${S.rejected.length ? html`<div class="small"><button class="chip" data-act="show-rejected">${S.rejected.length} record(s) not shown · why</button></div>` : ''}
      </div></aside>`;
  }

  // ------------------------------------------------------------------ main
  function mainPanel() {
    const sel = S.selected;
    if (S.mode === 'bridge' && S.link.join) return bridgeInviteCard();
    if (S.link.drop) return dropCard();
    if (!sel) return html`<div class="empty">Loading…</div>`;
    if (sel.kind === 'mail') return mailPanel(sel.part);
    const scope = S.scopes.get(sel.id), view = S.views.get(sel.id);
    if (!view) return noAccessPanel(sel.id, scope);
    const tabs = [['bus', 'Messages & Bus'], ['inbox', 'Inbox Triage'], ['claims', 'Claims, Conditions & Handoff'], ['quarantine', `Quarantine (${view.quarantine.filter((q) => !q.ruling).length})`], ['access', scope.kind === 'topic' ? `Access & History${scope.requests.length && scope.admins.has(S.me) ? ' (' + scope.requests.length + ')' : ''}` : 'Access']];
    const body = { bus: busTab, inbox: inboxTab, claims: claimsTab, quarantine: quarantineTab, access: accessTab }[S.tab] || busTab;
    return html`<div class="topic-head"><div class="grow"><h2>${sel.id === '' ? scope.name : '# ' + scope.name}</h2>
        <div class="meta">${scope.group ? html`<span class="chip">h=${scope.group}</span>` : ''}<span class="chip">t=${scope.campaign}</span>
        ${scopeBadges(scope)}
        ${scope.kind === 'topic' ? html`<span class="badge">${scope.roster.members.length} member(s)</span>` : ''}
        ${scope.conflicts && scope.conflicts.length ? html`<span class="badge plum" title="two admins rotated at once; both keys are tried on read">epoch race: ${scope.conflicts.join(', ')}</span>` : ''}</div></div>
      <button class="btn" data-act="tab" data-tab="access">Grant Access</button>
      <button class="btn primary" data-act="pair">Pair Coding Agent</button></div>
      <nav class="tabs" role="tablist">${tabs.map(([k, l]) => html`<button class="tab ${S.tab === k ? 'on' : ''}" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-tab="${k}">${l}</button>`)}</nav>
      ${body(scope, view)}`;
  }
  function noAccessPanel(id, scope) {
    const why = S.access.get(id) || 'no key ring for this topic';
    if (scope && scope.kind === 'topic' && scope.roster.roleOf(S.me) === 'write-only') {
      const h = scope.roster.history.get(S.me), admin = h[h.length - 1].by;
      return html`<form class="card hero" data-keep="wo-${id}" data-form="drop" data-owner="${admin}" data-part="topic:${id}"><h2># ${id} · write-only</h2>
        <div class="meta">${roleBadge('write-only')}<span class="badge teal">pairwise NIP-44 · kind 4410</span></div>
        <p class="muted">${ROLE_NOTE['write-only']}. What you send here is sealed to ${who(admin)} alone, into their <code>topic:${id}</code> dropbox part, and held at their human gate until they approve it.</p>
        <label>Subject</label><input name="subject"><label style="margin-top:8px">Message</label><textarea name="body" required></textarea>
        <div class="actions"><button class="btn primary">Send to the admin</button></div></form>`;
    }
    const requested = (S.store.requested || []).find((r) => r.topic === id);
    return html`<section class="card hero" data-keep="req"><h2>Request Access to Topic (kind 9021)</h2>
      <p># <strong>${id}</strong> — <span class="muted">${why}</span></p>
      ${scope && scope.creator ? html`<p class="small">Admin: ${who(scope.creator)} ${seatBadges(scope.creator, scope)}</p>` : ''}
      ${requested ? html`<p class="banner info"><span class="grow">Request sent ${NM.isoStamp(requested.at)}. An admin approves it with full history or forward-only; the key ring then arrives as a kind 1059 gift wrap and this topic opens.</span></p>` : ''}
      <div class="row"><div><label for="rr">Why you need it (shown to the admins)</label><input id="rr" name="reason" placeholder="e.g. reviewing the retry fix"></div>
      <div class="fit"><button class="btn primary" data-act="request" data-id="${id}">${requested ? 'Request again' : 'Request Access'}</button></div></div></section>`;
  }

  // ---- Messages & Bus
  function busTab(scope, view) {
    const topics = [...new Set(['bus', ...Object.keys(view.topics).filter((t) => t !== 'inbox' && t !== 'dropbox')])];
    if (!topics.includes(S.busTopic)) S.busTopic = 'bus';
    const tv = view.topics[S.busTopic] || { messages: [], acks: [], sealed: false };
    const kinds = [...new Set(tv.messages.map((m) => m.kind))].sort();
    const shown = tv.messages.filter((m) => !S.kindFilter || m.kind === S.kindFilter).slice().reverse();
    const reply = S.replyTo ? tv.messages.find((m) => m.id === S.replyTo) : null;
    return html`<div class="row" style="margin-bottom:12px">
        <div><label for="bt">Topic</label><select id="bt" data-change="bus-topic">${topics.map((t) => html`<option value="${t}" ${t === S.busTopic ? 'selected' : ''}>${t}</option>`)}</select></div>
        <div><label for="kf">Filter by kind</label><select id="kf" data-change="kind-filter"><option value="">all kinds</option>${kinds.map((k) => html`<option ${k === S.kindFilter ? 'selected' : ''}>${k}</option>`)}</select></div>
        <div class="fit small muted">${tv.messages.length} message(s)${tv.sealed ? ' · sealed' : ''}</div></div>
      ${tv.broken ? html`<div class="banner">${tv.broken}</div>` : ''}
      ${tv.sealed ? html`<div class="banner info"><span class="grow">An operator sealed this topic: its journal is exactly the ${tv.seal.count} listed message(s), and nothing more is accepted.</span></div>` : html`
      <form class="card" data-keep="post" data-form="post">
        ${reply ? html`<div class="small">Replying to ${who(reply.author)}: <em>${reply.body.slice(0, 80)}</em> <button type="button" class="btn tiny ghost" data-act="reply" data-id="">cancel</button></div>` : ''}
        <label for="pb">Message to <code>${S.busTopic}</code></label><textarea id="pb" name="body" required placeholder="What you found, what you are taking, what you need."></textarea>
        <div class="row" style="margin-top:8px"><div><label for="pk">Kind</label><input id="pk" name="kind" value="message" list="kinds"><datalist id="kinds">${['message', 'handoff', 'finding', 'question', 'answer', 'claim', 'checkpoint'].map((k) => html`<option value="${k}">`)}</datalist></div>
        <div><label for="ps">Subject</label><input id="ps" name="subject"></div><div><label for="pr">Refs (comma separated)</label><input id="pr" name="refs" placeholder="issue:42, blob:<sha256>"></div>
        <div><label for="pf">Attach a blob</label><input id="pf" name="file" type="file"></div>
        <div class="fit"><button class="btn primary">Post</button></div></div></form>`}
      <div class="section-title"><h3>Stream</h3><span class="small muted">every event: id and Schnorr signature verified here, decrypted with the epoch it names</span></div>
      ${shown.length ? html`<ul class="list">${shown.map((m) => messageItem(scope, view, S.busTopic, m, tv))}</ul>` : html`<div class="empty">Nothing on <code>${S.busTopic}</code> yet.</div>`}`;
  }
  function refChips(refs) {
    return html`<div class="chips">${refs.map((r) => (/^blob:[0-9a-f]{64}$/.test(r) ? html`<button class="chip" data-act="blob" data-sha="${r.slice(5)}" title="preview or download, digest verified">⬇ ${r.slice(0, 17)}…</button>` : html`<span class="chip">${r}</span>`))}</div>`;
  }
  function messageItem(scope, view, topic, m, tv) {
    const acks = tv.acks.filter((a) => a.msg_id === m.id && a.seat !== NM.GATE_SEAT);
    const mine = acks.find((a) => a.author === S.me && a.seat === mySeat() && NM.TERMINAL.includes(a.disposition));
    return html`<li class="item"><div class="meta"><span class="who">${who(m.author)}</span>${seatBadges(m.author, scope)}${verified()}${epochBadge(m.epoch)}<span class="badge amber">${m.kind}</span>${ago(m.created_at)}
        ${m.released ? html`<span class="badge sage" title="released at the human gate by ${who(m.released.author)}">released</span>` : ''}<span class="chip" title="${m.id}">${m.id.slice(0, 10)}</span></div>
      ${m.subject ? html`<div><strong>${m.subject}</strong></div>` : ''}
      ${m.reply_to ? html`<div class="small muted">↳ reply to ${m.reply_to.slice(0, 10)}</div>` : ''}
      <div class="body">${m.body}</div>${m.refs.length ? refChips(m.refs) : ''}
      ${acks.length ? html`<div class="chips" style="margin-top:6px">${acks.map((a) => html`<span class="badge ${a.disposition === 'handled' ? 'sage' : a.disposition === 'rejected' ? 'plum' : ''}">${a.seat}: ${a.disposition}${a.result_ref ? ' → ' + a.result_ref : ''}</span>`)}</div>` : ''}
      <div class="actions"><button class="btn tiny ghost" data-act="reply" data-id="${m.id}">Reply</button>
      ${mine ? html`<span class="small muted">settled by your seat: ${mine.disposition}</span>` : m.author === S.me ? '' : html`<form class="actions" style="margin:0;flex:1" data-form="ack" data-id="${m.id}" data-topic="${topic}" data-keep="ack-${m.id}">
        <select name="disposition">${NM.DISPOSITIONS.map((d) => html`<option>${d}</option>`)}</select><input name="result_ref" placeholder="--result-ref (PR, commit, issue)"><input name="note" placeholder="note"><button class="btn tiny sage">Ack</button></form>`}</div></li>`;
  }
  const mySeat = () => NM.SLUG.test(S.store.seat || '') ? S.store.seat : seatSlug(S.store.handle);

  // ---- Inbox Triage
  function inboxTab(scope, view) {
    const t = NM.triage(view);
    const names = Object.keys(t.targets).sort();
    return html`<form class="card" data-keep="todo" data-form="todo"><label for="tn">One pointer into <code>inbox</code>: where to look, never a copy of what is there</label>
      <textarea id="tn" name="note" required placeholder="Look at the wave-7 report"></textarea>
      <div class="row" style="margin-top:8px"><div><label for="tt">--target</label><input id="tt" name="target" required placeholder="webapp"></div><div><label for="tsu">--surface</label><input id="tsu" name="surface"></div>
      <div><label for="td">--doc</label><input id="td" name="doc"></div><div><label for="tp">--page</label><input id="tp" name="page"></div><div class="fit"><button class="btn primary">Add todo</button></div></div></form>
      <div class="section-title"><h3>Unhandled, by target</h3><span class="small muted">compaction tripwire: ${t.compaction_rule}</span></div>
      ${names.length ? names.map((name) => { const row = t.targets[name]; return html`<section class="card trip ${row.compaction_due ? 'due' : ''}">
        <div class="meta"><strong>${name}</strong><span class="badge">${row.count} open</span><span class="badge">oldest ${row.oldest_age_hours}h</span>${row.compaction_due ? html`<span class="badge plum">compaction due: sweep this target in one pass</span>` : ''}</div>
        <ul class="list" style="margin-top:10px">${row.items.map((m) => html`<li class="item"><div class="meta"><span class="who">${who(m.author)}</span>${verified()}${epochBadge(m.epoch)}${ago(m.created_at)}</div>
          <div class="body">${m.body}</div>${refChips(m.refs.filter((r) => !r.startsWith('target:')))}
          <form class="actions" data-form="resolve" data-id="${m.id}" data-keep="res-${m.id}"><select name="disposition">${NM.TERMINAL.map((d) => html`<option>${d}</option>`)}</select>
          <input name="result_ref" placeholder="--result-ref (required for handled)"><input name="note" placeholder="note (ignored/rejected)"><button class="btn tiny sage">Resolve</button></form></li>`)}</ul></section>`; }) : html`<div class="empty">Inbox zero: every pointer is settled with where the work went.</div>`}`;
  }

  // ---- Claims, Conditions & Handoff
  function claimsTab(scope, view) {
    const reviewer = S.trust.reviewers.includes(S.me);
    const heads = [...view.heads.values()].sort((a, b) => a.condition.localeCompare(b.condition));
    const decided = new Map();
    for (const d of view.decisions) { if (!decided.has(d.claim)) decided.set(d.claim, []); decided.get(d.claim).push(d); }
    return html`<div class="section-title"><h3>Open conditions</h3><span class="small muted">reviewer-signed heads; each decision moves one revision</span></div>
      ${heads.length ? heads.map((c) => { const prov = { condition: c.condition, revision: c.rev, state: c.state, head: c.event.id, reviewer: NM.npub(c.reviewer), decision: c.last_decision || 'none', claim: c.last_claim || 'none' }; const md = NM.renderHandoff(NM.conditionHandoff(c), prov); return html`<section class="card">
        <div class="meta"><strong>${c.condition}</strong><span class="badge ${c.state === 'open' ? 'amber' : 'sage'}">${c.state}</span><span class="badge">rev ${c.rev}</span>by ${who(c.reviewer)} ${verified()}</div>
        <div class="grid2" style="margin-top:8px"><dl class="kv"><dt>goal</dt><dd>${c.goal}</dd><dt>statement</dt><dd>${c.statement}</dd><dt>next action</dt><dd>${c.next_action}</dd>
          <dt>evidence</dt><dd>${c.evidence.length ? refChips(c.evidence.map((e) => e)) : '—'}</dd><dt>rejected</dt><dd>${c.rejected_routes.length ? c.rejected_routes.map((r) => html`<div class="small">${r}</div>`) : '—'}</dd></dl>
        <div><div class="meta"><strong>HANDOFF.md</strong><span class="small muted">the four-field packet <code>handoff materialize</code> writes</span></div><pre class="doc">${md}</pre>
        <div class="actions"><button class="btn tiny" data-act="download" data-name="HANDOFF-${c.condition}.md" data-text="${md}">Download HANDOFF.md</button><button class="btn tiny ghost" data-act="copy" data-text="${md}">Copy</button></div></div></div></section>`; }) : html`<div class="empty">No condition opened yet.</div>`}
      ${reviewer ? html`<form class="card" data-keep="cond" data-form="condition" style="margin-top:14px"><h3>Open a condition (reviewer)</h3><div class="grid2" style="margin-top:8px">
        <div><label>Condition slug</label><input name="condition" required placeholder="ac-3"></div><div><label>Goal</label><input name="goal" required></div>
        <div><label>Statement (what must be shown)</label><input name="statement" required></div><div><label>Next action</label><input name="next_action" required></div></div>
        <div class="actions"><button class="btn primary">Open condition</button></div></form>` : ''}
      <div class="section-title"><h3>Claims</h3><span class="small muted">a claim is a proposal until a reviewer accepts, narrows or rejects it</span></div>
      ${view.claims.length ? html`<ul class="list">${view.claims.slice().reverse().map((cl) => { const ds = decided.get(cl.id) || []; const head = view.heads.get(cl.condition); return html`<li class="item">
        <div class="meta"><span class="who">${who(cl.author)}</span>${seatBadges(cl.author, scope)}${verified()}${epochBadge(cl.epoch)}<span class="badge amber">${cl.effect}</span><span>${cl.condition}@rev ${cl.condition_rev}</span>${ago(cl.created_at)}<span class="badge ${ds.length ? 'sage' : ''}">${ds.length ? 'decided' : 'proposal'}</span></div>
        <div class="small" style="margin-top:6px">candidate <span class="chip">${cl.candidate_digest.slice(0, 16)}…</span>${cl.wave ? html` · wave ${cl.wave}` : ''}${cl.task ? html` · task ${cl.task}` : ''}</div>
        <div style="margin-top:6px">${refChips(cl.evidence_refs)}</div>
        ${ds.map((d) => html`<div class="small" style="margin-top:6px"><span class="badge ${d.outcome === 'accepted' ? 'sage' : d.outcome === 'rejected' ? 'plum' : 'amber'}">${d.outcome}</span> by ${who(d.author)}: ${d.reason}</div>`)}
        ${reviewer && !ds.some((d) => d.author === S.me) && cl.author !== S.me ? html`<form class="stack" data-form="decide" data-id="${cl.id}" data-keep="dec-${cl.id}" style="margin-top:8px">
          ${head && head.rev !== cl.condition_rev ? html`<div class="small muted">stale: the condition now stands at revision ${head.rev}</div>` : ''}
          <div class="row"><div><label>Outcome</label><select name="outcome"><option>accepted</option><option>narrowed</option><option>rejected</option></select></div><div><label>Reason (one line)</label><input name="reason" required></div><div><label>Next action</label><input name="next_action" required></div></div>
          <div class="row"><div><label>Narrowed statement (to narrow)</label><input name="statement"></div><div><label>Reopen if (to reject)</label><input name="reopen_if"></div><div class="fit"><button class="btn sage">Decide</button></div></div></form>` : ''}</li>`; })}</ul>` : html`<div class="empty">No claims yet.</div>`}
      <form class="card" data-keep="claim" data-form="claim" style="margin-top:14px"><h3>Submit a claim</h3><div class="grid2" style="margin-top:8px">
        <div><label>Condition</label><select name="condition">${heads.filter((c) => c.state === 'open').map((c) => html`<option value="${c.condition}">${c.condition} (rev ${c.rev})</option>`)}</select></div>
        <div><label>Effect</label><select name="effect"><option>closes</option><option>narrows</option><option>falsifies</option></select></div>
        <div><label>Candidate digest (sha256) or a file to upload</label><input name="candidate_digest" placeholder="64 hex"><input name="file" type="file" style="margin-top:6px"></div>
        <div><label>Evidence refs (comma separated)</label><input name="evidence_refs" placeholder="blob:<sha256>, ci:run/123"></div></div>
        <div class="actions"><button class="btn primary" ${heads.some((c) => c.state === 'open') ? '' : 'disabled'}>Submit claim</button></div></form>
      <div class="section-title"><h3>Handoff packets</h3><span class="small muted">a colleague's note; who signed it is part of reading it</span></div>
      ${view.handoffs.length ? html`<ul class="list">${view.handoffs.slice().reverse().map((h) => { const md = NM.renderHandoff(h, { event: h.id, from: NM.npub(h.author), 'for-seat': h.for_seat || 'anyone' }); return html`<li class="item"><div class="meta"><span class="who">${who(h.author)}</span>${verified()}${ago(h.created_at)}<span class="badge">for ${h.for_seat || 'anyone'}</span></div><pre class="doc">${md}</pre></li>`; })}</ul>` : html`<div class="empty">No packets.</div>`}

        <div class="row" style="margin-top:8px"><div><label>For seat (optional)</label><input name="for_seat"></div><div class="fit"><button class="btn primary">Send handoff</button></div></div></form>
      <div class="section-title"><h3>Operator directives &amp; OPERATOR.md</h3><span class="small muted">verified against ${S.trust.operator_pubkeys.length} operator key(s); binding once adopted with <code>directive adopt</code></span></div>
      <div class="grid2"><div>${view.ledger.inForce.length ? html`<ul class="list">${view.ledger.inForce.map((d) => html`<li class="item"><div class="meta"><span class="badge terra">seq ${d.seq}</span>${who(d.operator)}${verified()}${ago(d.created_at)}<span class="badge">${d.audience.join(', ')}</span></div><div class="body">${d.text}</div></li>`)}</ul>` : html`<div class="empty">No directive in force.</div>`}

  // ---- Quarantine
  function quarantineTab(scope, view) {
    const admin = scope.admins.has(S.me);
    const items = view.quarantine;
    return html`<div class="banner info"><span class="grow">human_gated: a message whose author was outside this ${scope.kind === 'topic' ? "topic's roster" : 'campaign'} when it was written is held here, not in the stream, until an admin releases or declines it with a <code>human-gate</code> ack (kind 8888) that every member can verify.</span></div>
      ${scope.kind === 'root' ? html`<div class="empty">The root campaign has no topic roster: every relay member may write it, so nothing is held here. Shared topics and your dropboxes have a gate.</div>` : items.length ? html`<ul class="list">${items.map((m) => html`<li class="item held ${m.ruling ? 'dim' : ''}">
        <div class="meta"><span class="who">${who(m.author)}</span>${verified()}${epochBadge(m.epoch)}<span class="badge plum">${m.why}</span>${ago(m.created_at)}${m.ruling ? html`<span class="badge">${m.ruling.disposition === 'handled' ? 'released' : 'declined'} by ${who(m.ruling.author)}</span>` : ''}</div>
        <div class="body">${m.body}</div>${refChips(m.refs)}
        ${admin && !m.ruling ? html`<div class="actions"><button class="btn tiny sage" data-act="gate" data-id="${m.id}" data-topic="${m.topic}" data-ok="1">Approve (release)</button><button class="btn tiny warn" data-act="gate" data-id="${m.id}" data-topic="${m.topic}" data-ok="">Decline</button></div>` : ''}</li>`)}</ul>` : html`<div class="empty">Nothing held.</div>`}`;
  }

  // ---- Access & History
  function accessTab(scope, view) {
    if (scope.kind === 'root') {
      return html`<section class="card"><h3>The root campaign</h3><dl class="kv" style="margin-top:8px"><dt>operators</dt><dd>${S.trust.operator_pubkeys.map((pk) => html`<div>${who(pk)} <span class="chip">${short(pk)}</span></div>`)}</dd>
        <dt>reviewers</dt><dd>${S.trust.reviewer_pubkeys.length ? S.trust.reviewer_pubkeys.map((pk) => html`<div>${who(pk)}</div>`) : '—'}</dd><dt>leads</dt><dd>${S.trust.lead_pubkeys.length ? S.trust.lead_pubkeys.map((pk) => html`<div>${who(pk)}</div>`) : '—'}</dd>
        <dt>key</dt><dd>${scope.epochs.length ? 'one campaign_key (epoch 1), carried in nm1_ invite tokens' : 'none: payloads are cleartext JSON'}</dd></dl>
        <p class="small muted">Relay membership (NIP-43) is granted with single-use invites and revoked by the operator's relay admin (<code>nostr-mailbox relay revoke</code>). For per-collaborator history control, create a shared topic: its key ring rotates.</p></section>${inviteCard(null)}`;
    }
    const admin = scope.admins.has(S.me);
    const mode = S.grantMode || 'full_history';
    const hist = (name) => html`<label class="radio ${mode === 'full_history' ? 'on' : ''}"><input type="radio" name="${name}" value="full_history" ${mode === 'full_history' ? 'checked' : ''} data-change="grant-mode"><span><strong>(●) Full History</strong> — deliver every epoch ${[...new Set(scope.epochs.map((e) => e.n))].sort((a, b) => a - b).join(', ')} via kind 1059, so the collaborator replays all historical campaign messages, claims, handoffs and blobs.</span></label>
      <label class="radio ${mode === 'forward_only' ? 'on' : ''}"><input type="radio" name="${name}" value="forward_only" ${mode === 'forward_only' ? 'checked' : ''} data-change="grant-mode"><span><strong>( ) Forward-Only from now</strong> — rotate the topic to Epoch ${(scope.current || 0) + 1}; prior epochs stay undecryptable for them.</span></label>`;
    const roles = (name, chosen) => html`<select name="${name}">${NM.ROLES.map((r) => html`<option value="${r}" ${r === chosen ? 'selected' : ''}>${r} — ${ROLE_NOTE[r]}</option>`)}</select>`;
    return html`${admin ? html`<form class="card" data-keep="grant" data-form="grant"><h3>Grant Access / Invite Collaborator</h3>
        <div class="row" style="margin-top:10px"><div><label for="gm">Collaborator (npub or hex)</label><input id="gm" name="member" required placeholder="npub1…"></div>
        <div><label>Role</label>${roles('role', 'read-write')}</div></div>
        <div class="stack" style="margin-top:10px">${hist('mode')}<span class="small muted">The history choice does not apply to write-only: it is never given a key ring.</span></div>
        <div class="actions"><button class="btn primary">Grant Access (kind 9000 + key ring)</button></div></form>` : html`<div class="banner info"><span class="grow">Only the topic's admins (${[...scope.admins].map(who).join(', ')}) grant and revoke.</span></div>`}
      ${admin ? inviteCard(scope) : ''}
      <div class="section-title"><h3>Pending join requests (kind 9021)</h3></div>
      ${scope.requests.length ? html`<ul class="list">${scope.requests.map((r) => { const t = ticketTerms(scope, r); return html`<li class="item" data-keep="req-${r.id}"><div class="meta"><span class="who">${who(r.pubkey)}</span><span class="chip">${short(r.pubkey)}</span>${ago(r.created_at)}${r.code ? html`<span class="badge">with invite code</span>` : ''}${t ? t.badge : ''}</div>
        ${r.reason ? html`<div class="body">${r.reason}</div>` : ''}
        ${admin && t && t.admit ? html`<div class="actions"><button class="btn tiny primary" data-act="admit" data-pk="${r.pubkey}" data-ticket="${r.ticket}">Admit as invited: ${t.terms.role}${t.terms.history ? ', ' + t.terms.history.replace('_', ' ') : ''}</button></div>` : ''}
        ${admin ? html`<div class="actions"><label class="small">Role ${roles('role', t && t.terms ? t.terms.role : 'read-write')}</label><button class="btn tiny sage" data-act="approve" data-pk="${r.pubkey}" data-mode="full_history">Approve with Full History</button><button class="btn tiny" data-act="approve" data-pk="${r.pubkey}" data-mode="forward_only">Approve Forward-Only</button><button class="btn tiny warn" data-act="decline" data-id="${r.id}">Decline</button></div>` : ''}</li>`; })}</ul>` : html`<div class="empty">No pending requests.</div>`}
      <div class="section-title"><h3>Active members</h3><span class="small muted">revoking writes kind 9001 and rotates every remaining member to a fresh epoch</span></div>
      <ul class="list">${scope.roster.members.map((pk) => html`<li class="item"><div class="meta"><span class="who">${who(pk)}</span>${seatBadges(pk, scope)}<span class="chip">${short(pk)}</span>
        ${admin && pk !== scope.creator && pk !== S.me ? html`<span class="spacer" style="flex:1"></span><button class="btn tiny warn" data-act="revoke" data-pk="${pk}">Revoke (kind 9001 + Rotate Epoch)</button>` : ''}</div></li>`)}</ul>
      <div class="section-title"><h3>Epoch key ring</h3><span class="small muted">keys this key holds; a message names its epoch, and its key opens it</span></div>
      <section class="card"><ul class="list">${[...scope.epochs].sort((a, b) => a.n - b.n).map((e) => html`<li class="small">Epoch ${e.n} · from ${who(e.granter)} · ${NM.isoStamp(e.at)}${e.n === scope.current ? html` <span class="badge teal">current</span>` : ''}</li>`)}</ul>
      ${scope.ignoredRings.length ? html`<p class="small muted">${scope.ignoredRings.length} key ring(s) from non-admin keys were ignored.</p>` : ''}</section>`;
  }
  /** A join request's ticket, matched against the invites this workstation minted (by
      digest: /api/invites never hands out a ticket). Two keys presenting one ticket
      contest it, and it admits neither. */
  function ticketTerms(scope, r) {
    if (!r.ticket) return null;
    if (S.mode !== 'bridge') return { badge: html`<span class="badge" title="only the console that minted it can match it">presents an invite ticket</span>` };
    const digest = NM.hex(NM.sha256(NM.utf8(r.ticket)));
    const terms = (S.invites.topics[scope.group] || []).find((x) => x.ticket_sha256 === digest);
    if (!terms) return { badge: html`<span class="badge plum">presents a ticket this workstation did not mint</span>` };
    if (terms.admitted) return { terms, badge: html`<span class="badge plum">ticket already admitted ${short(terms.admitted)}</span>` };
    if (terms.expires_at < NM.nowS()) return { terms, badge: html`<span class="badge plum">ticket expired ${NM.isoStamp(terms.expires_at)}</span>` };
    const presenters = new Set(scope.requests.filter((x) => x.ticket === r.ticket).map((x) => x.pubkey));
    if (presenters.size > 1) return { terms, badge: html`<span class="badge plum" title="approve one by hand with the role you choose">ticket contested by ${presenters.size} keys</span>` };
    return { terms, admit: true, badge: html`<span class="badge sage">invited${terms.member ? ' as ' + terms.member : ''} · ${terms.role}</span>` };
  }
  /** A campaign invite minted in this tab, as `crosswire invite` mints one over the socket
      (cli.cmd_relay_invite): a NIP-43 code the relay mints for any member when its
      memberClaims is on, in this campaign's nm1_ token. A topic invite also needs a NIP-29
      group code and the topic's key-ring registry, which only the CLI and the bridge
      keep, so this tab mints none. Unlike the CLI, the tab does not check the code's
      signer against the relay's NIP-11 key; the event's signature is verified. */
  async function mintStandaloneInvite(member) {
    const invite = await S.relay.requestInvite();
    const token = NM.encodeInviteToken(S.trust, invite.code, member);
    return { topic: null, member, token, via: invite.via, join_url: NM.joinUrl(S.trust, token),
      web_link: `${S.trust.blossom_origin}/#join=${token}`,
      one_liner: `uvx --from git+https://github.com/awowIO/crosswire crosswire join ${token}`,
      note: 'A bearer invite: whoever holds the token joins once, and how long the code lives is the relay\'s policy. Both links keep it in the URL fragment, which a browser never sends to a server.' };
  }
  function inviteCard(scope) {
    const canMint = S.mode === 'bridge' ? !!(S.bridge.state && S.bridge.state.capabilities.invite) : !scope;
    if (!canMint) return '';
    const minted = S.minted && S.minted.topic === (scope ? scope.group : null) ? S.minted : null;
    return html`<form class="card" data-keep="invite" data-form="invite" data-topic="${scope ? scope.group : ''}"><h3>Mint a single-use invite${scope ? ' into this topic' : ''}</h3>
      <p class="small muted">${S.mode === 'bridge' ? html`Runs the relay's admin through <code>admin.json</code>. ${scope ? 'The link opens the newcomer\'s console on this topic; their join request (kind 9021) presents the ticket, and "Admit as invited" grants exactly the role and history chosen here.' : ''}` : html`Asks the relay for a NIP-43 member invite over this tab's WebSocket (kind 28935), which a relay with <code>memberClaims</code> mints for any member.`}</p>
      <div class="row"><div><label>Friend or agent name</label><input name="member" placeholder="roland"></div>
      ${scope ? html`<div><label>Role</label><select name="role">${NM.ROLES.map((r) => html`<option value="${r}">${r} — ${ROLE_NOTE[r]}</option>`)}</select></div>
      <div><label>History</label><select name="history"><option value="full_history">full history</option><option value="forward_only">forward-only from now</option></select></div>` : ''}
      <div class="fit"><button class="btn primary">Mint invite</button></div></div>
      ${minted ? html`<div class="stack" style="margin-top:10px"><div class="small">1-click browser join link (bearer, single use${minted.role ? ', ' + minted.role : ''}):</div><pre class="doc">${minted.join_url}</pre>
        <div class="small">Invite token:</div><pre class="doc">${minted.token}</pre>
        <div class="actions"><button class="btn tiny primary" data-act="copy" data-text="${minted.join_url}" type="button">Copy join link</button><button class="btn tiny" data-act="copy" data-text="${minted.token}" type="button">Copy nm1_ token</button><button class="btn tiny" data-act="copy" data-text="${minted.one_liner}" type="button">Copy CLI one-liner</button><button class="btn tiny ghost" data-act="copy" data-text="${minted.web_link}" type="button">Copy relay-origin link</button><span class="small muted">${minted.expires_at ? 'expires ' + NM.isoStamp(minted.expires_at) : 'lifetime: the relay\'s policy'}</span></div>
        <p class="small muted">${minted.note}</p></div>` : ''}</form>`;
  }

  // ---- mailbox
  function mailPanel(part) {
    const mb = S.mailbox;
    const tab = ['mail', 'grants', 'held'].includes(S.mailTab) ? S.mailTab : 'mail';
    const items = mb.items.filter((m) => m.part === part && (m.owner === S.me));
    const held = mb.held.filter((m) => m.part === part);
    const threads = new Map();
    for (const m of items) { if (!threads.has(m.thread)) threads.set(m.thread, []); threads.get(m.thread).push(m); }
    const receipts = mb.receipts;
    const link = `#drop=${NM.npub(S.me)}/${part}`;
    const elsewhere = part === 'inbox' ? mb.items.filter((m) => m.owner !== S.me) : [];
    const body = tab === 'grants' ? grantsView(mb, part) : tab === 'held' ? heldView(held) : html`
      ${threads.size ? [...threads.values()].reverse().map((ms) => html`<section class="card"><ul class="list">${ms.map((m) => mailItem(m, receipts))}</ul></section>`) : html`<div class="empty">No mail in @me/${part} yet. Share your drop link fragment (top right).</div>`}
      ${elsewhere.length ? html`<div class="section-title"><h3>Your threads in other mailboxes</h3></div><section class="card"><ul class="list">${elsewhere.map((m) => mailItem(m, receipts))}</ul></section>` : ''}`;
    return html`<div class="topic-head"><div class="grow"><h2>@me/${part}</h2><div class="meta"><span class="badge teal">pairwise NIP-44 · kind 4410</span><span class="badge">send_only peers cannot read each other</span></div></div>
      <button class="btn" data-act="copy" data-text="${link}">Copy drop link fragment</button></div>
      <nav class="tabs">${[['mail', 'Mail'], ['grants', 'Who may write'], ['held', `Quarantine (${held.filter((m) => !m.ruling).length})`]].map(([k, l]) => html`<button class="tab ${tab === k ? 'on' : ''}" data-act="mail-tab" data-tab="${k}">${l}</button>`)}</nav>${body}`;
  }
  function mailItem(m, receipts) {
    const rs = receipts.filter((r) => r.reply_to === m.msg);
    return html`<li class="item"><div class="meta"><span class="who">${m.outgoing ? 'you → ' + who(m.to) : who(m.from)}</span>${verified()}${m.seat ? html`<span class="badge" title="sealed by seat ${m.seat.pubkey}">seat-signed</span>` : ''}${ago(m.created_at)}${m.released ? html`<span class="badge sage">released</span>` : ''}</div>
      ${m.body.subject ? html`<div><strong>${m.body.subject}</strong></div>` : ''}<div class="body">${m.body.body}</div>
      ${(m.body.attachments || []).length ? html`<div class="chips">${m.body.attachments.map((a) => html`<span class="chip" title="${a.sha256}">📎 ${a.dest} · ${a.bytes} bytes</span>`)}</div>` : ''}
      ${rs.map((r) => html`<div class="small"><span class="badge">${r.body.status}</span> ${r.body.note || ''}</div>`)}
      ${m.outgoing ? '' : html`<div class="actions"><button class="btn tiny" data-act="receipt" data-id="${m.id}" data-status="received">Received</button><button class="btn tiny sage" data-act="receipt" data-id="${m.id}" data-status="resolved">Resolved</button><button class="btn tiny warn" data-act="receipt" data-id="${m.id}" data-status="declined">Decline</button></div>
      <form class="actions" data-form="mail-reply" data-id="${m.id}" data-keep="mr-${m.id}"><input name="body" placeholder="Reply in this thread"><button class="btn tiny">Reply</button></form>`}</li>`;
  }
  function grantsView(mb, part) {
    const grants = [...mb.grants.values()];
    return html`<form class="card" data-keep="mgrant" data-form="mail-grant"><h3>Let a key write into @me/${part}</h3><div class="grid2" style="margin-top:8px">
      <div><label>Peer (npub or hex)</label><input name="peer" required></div>
      <div><label>Scope</label><select name="scope"><option value="send_only">send_only — they write, they read only their own threads</option><option value="topic_scoped">topic_scoped</option><option value="full_peer">full_peer</option></select></div>
      <div><label>Trust</label><select name="trust"><option value="human_gated">human_gated — hold every message for your approval</option><option value="trusted_auto">trusted_auto</option></select></div>
      <div><label class="radio"><input type="checkbox" name="read_replies"> they may read your replies</label></div></div>
      <div class="actions"><button class="btn primary">Grant (kind 4420)</button></div></form>
      <ul class="list" style="margin-top:12px">${grants.map((g) => html`<li class="item ${g.active ? '' : 'dim'}"><div class="meta"><span class="who">${who(g.peer)}</span><span class="badge">${g.active ? g.scope : 'revoked'}</span>${g.active ? html`<span class="badge ${g.trust === 'human_gated' ? 'amber' : 'sage'}">${g.trust}</span><span class="small">parts: ${g.parts.join(', ') || 'all'}</span>` : ''}${ago(g.event.created_at)}
        ${g.active ? html`<button class="btn tiny warn" data-act="mail-revoke" data-pk="${g.peer}">Revoke (4421)</button>` : ''}</div></li>`)}</ul>`;
  }
  function heldView(held) {
    return held.length ? html`<ul class="list">${held.map((m) => html`<li class="item held ${m.ruling ? 'dim' : ''}"><div class="meta"><span class="who">${who(m.from)}</span><span class="badge plum">${m.why}</span>${ago(m.created_at)}${m.ruling ? html`<span class="badge">${m.ruling.disposition === 'handled' ? 'released' : 'declined'}</span>` : ''}</div>
      ${m.granted ? html`${m.body.subject ? html`<div><strong>${m.body.subject}</strong></div>` : ''}<div class="body">${m.body.body}</div>` : html`<div class="small muted">Not decrypted: there is no grant for this key. Only who, when and which thread are shown.</div>`}

  /** argv from a command line quoted for a POSIX shell, as Python's shlex.join quotes
      the bridge's `cli`: words, '…' and "…" spans, and backslash escapes. */
  function shellSplit(line) {
    const argv = [];
    let word = null, i = 0;
    while (i < line.length) {
      const c = line[i];
      if (c === "'") {
        const end = line.indexOf("'", i + 1);
        if (end < 0) throw new NM.NMError(`an unclosed ' in ${line}`);
        word = (word || '') + line.slice(i + 1, end); i = end + 1;
      } else if (c === '"') {
        let j = i + 1, part = '';
        while (j < line.length && line[j] !== '"') { if (line[j] === '\\' && j + 1 < line.length) j += 1; part += line[j]; j += 1; }
        if (j >= line.length) throw new NM.NMError(`an unclosed " in ${line}`);
        word = (word || '') + part; i = j + 1;
      } else if (/\s/.test(c)) {
        if (word !== null) { argv.push(word); word = null; }
        i += 1;
      } else if (c === '\\' && i + 1 < line.length) { word = (word || '') + line[i + 1]; i += 2; }
      else { word = (word || '') + c; i += 1; }
    }
    if (word !== null) argv.push(word);
    return argv;
  }

  /** A blob named in the selected scope. Inside a topic it is opened under the epoch

      returned is checked before anything is opened or shown. */
  async function blobModal(sha, asStored) {
    const scope = scopeNow();
    let got;
    try { got = await S.desk.getBlob(scope, sha, { asStored: !!asStored }); } catch (e) {
      if (e.code !== 'Unopened') throw e;
      openModal(`Blob ${sha.slice(0, 16)}…`, () => html`<p class="banner"><span class="grow">${e.message}</span></p>
        <div class="actions"><button class="btn" data-act="blob-as-stored" data-sha="${sha}">Show as stored, not opened (--plain)</button></div>`);
      return;
    }
    const d = got.data, magic = NM.hex(d.subarray(0, 8));
    const type = magic.startsWith('89504e47') ? 'image/png' : magic.startsWith('ffd8ff') ? 'image/jpeg' : magic.startsWith('47494638') ? 'image/gif' : got.type;
    let textBody = null;

    if (!type.startsWith('image/')) { try { textBody = NM.fromUtf8(d); } catch (e) { textBody = null; } }
    const url = URL.createObjectURL(new Blob([d], { type }));
    const how = got.sealed ? `sealed in epoch ${got.epoch}, opened ${S.mode === 'bridge' ? 'by the bridge' : 'in this tab'} after the stored sha256 was verified` : asStored ? 'as stored, not opened · sha256 verified' : 'sha256 verified';
    openModal(`Blob ${sha.slice(0, 16)}…`, () => html`<p class="small muted">${d.length} bytes · ${how}</p>
      ${type.startsWith('image/') ? html`<img class="preview" alt="blob ${sha}" src="${url}">` : textBody !== null ? html`<pre class="doc">${textBody}</pre>` : html`<div class="empty">binary (${type})</div>`}
      <div class="actions"><a class="btn" href="${url}" download="${sha}">Download</a></div>`);

      if (f.kind === 'dropbox') {
        const named = f.part.trim(), part = NM.MAIL_PART.test(named) ? named : `topic:${named}`;
        if (part.length > 128 || !NM.MAIL_PART.test(part)) throw new NM.NMError(`part ${named} must be a slug (it becomes topic:${named})`);
        localStorage.setItem(partsKey(), JSON.stringify([...new Set([...savedParts(), part])]));
        if (f.peer.trim()) await S.desk.grantMail(f.peer.trim(), { parts: [part] });
        S.modal = null; S.selected = { kind: 'mail', part }; await refresh(); return;
      }
      const id = (f.id.trim() || f.name.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^[^a-z0-9]+/, '')).slice(0, 64);
      if (S.mode === 'bridge') await api('/api/topic/create', { topic: id, name: f.name.trim() });
      else await S.desk.createTopic(id, f.name.trim());
      S.modal = null; S.selected = { kind: 'scope', id }; S.tab = 'access'; toast(`Topic ${id} created at epoch 1`); await refresh();
    },
    async 'mail-grant'(f) { await S.desk.grantMail(f.peer.trim(), { scope: f.scope, trust: f.trust, readReplies: !!f.read_replies, parts: [S.selected.part] }); toast('Granted (kind 4420)'); await refresh(); },
    async 'mail-reply'(f, el) {
      const m = S.mailbox.items.find((x) => x.id === el.dataset.id);
      const ev = await NM.buildMail(S.signer, { owner: m.owner, reader: m.outgoing ? m.to : m.from, part: m.part, campaign: S.trust.campaign, body: f.body, inReplyTo: mailOuter(m) });
      await S.relay.publish(ev); toast('Reply sent'); await refresh();
    },
    async drop(f, el) { await S.desk.sendMail({ owner: el.dataset.owner, part: el.dataset.part, subject: f.subject.trim(), body: f.body }); forgetLink('drop'); toast('Sent (kind 4410)'); draw(); },
  };
  const changes = {
    seat(el) { if (!NM.SLUG.test(el.value)) { report(new NM.NMError(`seat ${el.value} must match ${NM.SLUG.source}`)); return; } S.store.seat = el.value; if (S.mode === 'standalone') saveStore(); },
    'bus-topic'(el) { S.busTopic = el.value; draw(); },
    'kind-filter'(el) { S.kindFilter = el.value; draw(); },
    'grant-mode'(el) { S.grantMode = el.value; draw(); },
    'new-kind'(el) { S.newKind = el.value; draw(); },
    async persona(el) { if (el.value !== S.bridge.state.active_persona) await switchPersona(el.value, false); },
    'pair-client'(el) { S.pair.client = el.value; draw(); },
    async 'pair-room'(el) { await pairRoom(el.value); draw(); },
    'pair-role'(el) { S.pair.role = el.value; draw(); },
    'pair-history'(el) { S.pair.history = el.value; draw(); },
  };
  const PUBLIC = new Set(['theme', 'home', 'chapter', 'harness', 'copy', 'dismiss', 'maywe-invite', 'link-dismiss']);
  const ENTRY = new Set(['redeem', 'sign-in', 'nip07', 'reconnect', 'bridge-join', 'persona', 'persona-create']);
  async function run(name, fn) {
    const entry = ENTRY.has(name);
    if (!S.desk && !entry && !PUBLIC.has(name)) return;
    if (entry && S.signingIn) return;
    if (entry) { S.signingIn = true; S.errors = []; }
    try { await fn(); } catch (e) { report(e, name); }
    finally { if (entry) { S.signingIn = false; draw(); } }
  }
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || !acts[el.dataset.act]) return;
    if (el.tagName === 'BUTTON' || el.tagName === 'A' && !el.hasAttribute('download')) ev.preventDefault();
    if (el.dataset.act === 'modal-close-backdrop' && ev.target !== el) return;
    run(el.dataset.act, () => acts[el.dataset.act](el.dataset, el, ev));
  });
  document.addEventListener('submit', (ev) => {
    const el = ev.target.closest('[data-form]');
    if (!el) return;
    ev.preventDefault();
    const button = el.querySelector('button:not([type=button])');
    if (button) button.disabled = true;
    run(el.dataset.form, () => forms[el.dataset.form](form(el), el)).finally(() => { if (button && button.isConnected) button.disabled = false; });
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-change]');
    if (el && changes[el.dataset.change]) run(el.dataset.change, () => changes[el.dataset.change](el));
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.modal) { S.modal = null; draw(); } });
  boot().catch((e) => report(e, 'starting the console'));
})();
</script>
