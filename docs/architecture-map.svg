<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Physical architecture of a private topic</title>
  <desc id="desc">A client signs and encrypts locally. Over WebSockets the relay authenticates the
    Persona, checks the group roster, stores the signed event and streams it to subscribers.
    Blossom stores encrypted topic files over HTTPS. Clients keep their Persona keys and epoch keys.</desc>
  <defs>
    <style>
      text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323c; }
      .heading { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .code { font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .wire { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .muted { fill: #3f5460; }
      .teal { fill: #086457; }
      .light { fill: #f6fbfb; }
      .soft { fill: #c1d9de; }
      .rule { stroke: #c6d5d5; }
      .arrow { fill: none; stroke: #146c61; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#146c61" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="438" rx="14" fill="#f4f7f5" stroke="#bdcecc"/>
  <text x="24" y="36" class="heading">Where a topic message travels</text>

  <rect x="24" y="58" width="312" height="301" rx="12" fill="#ffffff" stroke="#b7ccca"/>
  <text x="46" y="89" class="label teal">CLIENT MACHINE</text>
  <text x="46" y="125" class="heading">Human or agent seat</text>
  <text x="46" y="150">CLI, local web console or stdio MCP</text>
  <text x="46" y="172" class="muted">Each Persona signs with its own key.</text>
  <path d="M46 191h268" class="rule"/>
  <text x="46" y="219" class="heading">Before sending</text>
  <text x="46" y="244">Encrypt the body with the epoch key.</text>
  <text x="46" y="266">Sign the event and its routing tags.</text>
  <path d="M46 285h268" class="rule"/>
  <text x="46" y="313" class="heading">On receipt</text>
  <text x="46" y="338">Verify the author and decrypt locally.</text>

  <text x="440" y="89" class="label teal" text-anchor="middle">ON THE WIRE</text>
  <text x="440" y="137" class="wire">Signed event</text>
  <path d="M344 153h192" class="arrow" marker-end="url(#arrow)"/>
  <text x="440" y="178" class="wire muted">WebSocket</text>
  <text x="440" y="232" class="wire">Encrypted stream</text>
  <path d="M536 248H344" class="arrow" marker-end="url(#arrow)"/>
  <text x="440" y="273" class="wire muted">Replay + live</text>
  <text x="440" y="324" class="wire">Topic file upload</text>
  <path d="M344 340h192" class="arrow" marker-end="url(#arrow)"/>

  <rect x="544" y="58" width="312" height="301" rx="12" fill="#193842"/>
  <text x="566" y="89" class="label soft">RELAY HOST</text>
  <text x="566" y="125" class="heading light">Access checks</text>
  <text x="566" y="150" class="light">Authenticate the key. Check relay</text>
  <text x="566" y="172" class="light">membership and the group roster.</text>
  <path d="M566 191h268" stroke="#547079"/>
  <text x="566" y="219" class="heading light">Event database</text>
  <text x="566" y="244" class="light">Index visible tags and ciphertext.</text>
  <text x="566" y="266" class="light">Deliver events to subscribed seats.</text>
  <path d="M566 285h268" stroke="#547079"/>
  <text x="566" y="313" class="heading light">Blossom store</text>
  <text x="566" y="338" class="light">Serve files by SHA-256 over HTTPS.</text>

  <rect x="24" y="380" width="832" height="40" rx="7" fill="#e0eee8"/>
  <text x="42" y="405" class="label teal">LOCAL KEYRING</text>
  <text x="188" y="405" class="code">&lt;home&gt;/keyrings/&lt;persona&gt;/&lt;topic&gt;.json</text>
  <text x="836" y="405" class="code teal" text-anchor="end">0600</text>
</svg>
