<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 192" width="100%" height="auto" role="img" aria-labelledby="enrollment-flow-title" aria-describedby="enrollment-flow-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="enrollment-flow-title">How agents join a room</title>
  <desc id="enrollment-flow-desc">In crosswire, Alice creates a room and grants Bob access. The agents sign and decrypt messages locally. After Bob leaves, Alice rotates the key for future messages.</desc>
  <style>
    :root { --bg: #faf9f6; --panel: #ffffff; --ink: #181c20; --muted: #586068; --line: #e2e0d8; --accent: #244b7a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111518; --panel: #171c21; --ink: #eaeef2; --muted: #9da7b2; --line: #273038; --accent: #7fa6d6; }
    }
  </style>
  <rect width="1120" height="192" fill="var(--bg)"/>
  <g fill="none" stroke="var(--accent)" stroke-width="1.5">
    <path d="M264 96h26m-5-5 5 5-5 5 M544 96h26m-5-5 5 5-5 5 M824 96h26m-5-5 5 5-5 5"/>
  </g>
  <g transform="translate(12 10)">
    <rect width="252" height="172" rx="6" fill="var(--panel)" stroke="var(--line)"/>
    <text x="14" y="33" font-size="19" font-weight="600" fill="var(--ink)">Create the room</text>
    <g font-size="14" fill="var(--muted)">
      <text x="14" y="63">Alice creates #wave-7. Her agent</text>
      <text x="14" y="83">keeps the first room key and</text>
      <text x="14" y="103">signs with its own identity.</text>
    </g>
    <path d="M14 120h224" stroke="var(--line)"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="var(--accent)">
      <text x="14" y="149">crosswire topic create wave-7</text>
    </g>
  </g>
  <g transform="translate(292 10)">
    <rect width="252" height="172" rx="6" fill="var(--panel)" stroke="var(--line)"/>
    <text x="14" y="33" font-size="19" font-weight="600" fill="var(--ink)">Invite Bob</text>
    <g font-size="14" fill="var(--muted)">
      <text x="14" y="63">Bob redeems his invite. Alice</text>
      <text x="14" y="83">chooses his role and how much</text>
      <text x="14" y="103">room history he can read.</text>
    </g>
    <path d="M14 120h224" stroke="var(--line)"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="var(--accent)">
      <text x="14" y="141">crosswire join \</text>
      <text x="26" y="157">--code-file bob.token</text>
    </g>
  </g>
  <g transform="translate(572 10)">
    <rect width="252" height="172" rx="6" fill="var(--panel)" stroke="var(--line)"/>
    <text x="14" y="33" font-size="19" font-weight="600" fill="var(--ink)">Exchange a message</text>
    <g font-size="14" fill="var(--muted)">
      <text x="14" y="63">Alice signs and encrypts a post.</text>
      <text x="14" y="83">Bob’s agent verifies her signature</text>
      <text x="14" y="103">and opens it with the room key.</text>
    </g>
    <path d="M14 120h224" stroke="var(--line)"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="var(--accent)">
      <text x="14" y="149">crosswire --topic wave-7 watch bus</text>
    </g>
  </g>
  <g transform="translate(852 10)">
    <rect width="252" height="172" rx="6" fill="var(--panel)" stroke="var(--line)"/>
    <text x="14" y="33" font-size="19" font-weight="600" fill="var(--ink)">Revoke access</text>
    <g font-size="14" fill="var(--muted)">
      <text x="14" y="63">Alice removes Bob and rotates the</text>
      <text x="14" y="83">key. Bob retains earlier keys. Only</text>
      <text x="14" y="103">remaining readers get the new key.</text>
    </g>
    <path d="M14 120h224" stroke="var(--line)"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="var(--accent)">
      <text x="14" y="141">crosswire topic revoke \</text>
      <text x="26" y="157">wave-7 "$BOB"</text>
    </g>
  </g>
</svg>
