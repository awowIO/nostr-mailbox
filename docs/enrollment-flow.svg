<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Enrollment and cross-pool encryption in wave-7</title>
  <desc id="desc">Alice creates the topic. Bob's seat joins as a reader and writer using its own
    invite. Each seat signs as itself and uses the shared epoch to encrypt and decrypt posts.
    When Alice revokes Bob's seat, the remaining readers receive a new epoch key.</desc>
  <defs>
    <style>
      text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323c; }
      .heading { font-size: 16px; font-weight: 700; }
      .number { font-size: 14px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .code { font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #124f47; }
      .card { fill: #fff; stroke: #b7ccca; }
      .arrow { fill: none; stroke: #146c61; stroke-width: 2; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#146c61" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="438" rx="14" fill="#f4f7f5" stroke="#bdcecc"/>
  <text x="24" y="36" class="heading">One topic, two agent pools</text>

  <rect x="24" y="58" width="390" height="151" rx="12" class="card"/>
  <circle cx="55" cy="91" r="14" fill="#10675b"/>
  <text x="55" y="96" class="number">1</text>
  <text x="80" y="97" class="heading">Alice creates wave-7</text>
  <text x="45" y="130">Her seat becomes the keeper of a private room.</text>
  <text x="45" y="152">It generates the first epoch key locally.</text>
  <rect x="45" y="168" width="196" height="27" rx="5" fill="#e0eee8"/>
  <text x="56" y="186" class="code">topic create wave-7</text>

  <path d="M417 132h44" class="arrow" marker-end="url(#arrow)"/>
  <rect x="466" y="58" width="390" height="151" rx="12" class="card"/>
  <circle cx="497" cy="91" r="14" fill="#10675b"/>
  <text x="497" y="96" class="number">2</text>
  <text x="522" y="97" class="heading">Bob enrolls one seat</text>
  <text x="487" y="130">His seat redeems a read-write invite. Its own</text>
  <text x="487" y="152">keyring stores the epochs that Alice granted.</text>
  <rect x="487" y="168" width="269" height="27" rx="5" fill="#e0eee8"/>
  <text x="498" y="186" class="code">join --code-file wave-7.token</text>

  <path d="M661 212v22H219v19" class="arrow" marker-end="url(#arrow)"/>
  <rect x="24" y="259" width="390" height="157" rx="12" class="card"/>
  <circle cx="55" cy="292" r="14" fill="#10675b"/>
  <text x="55" y="297" class="number">3</text>
  <text x="80" y="298" class="heading">The two seats exchange a message</text>
  <text x="45" y="331">Alice signs her post. The relay delivers it to Bob,</text>
  <text x="45" y="353">who opens it with the same epoch key.</text>
  <rect x="45" y="371" width="222" height="27" rx="5" fill="#e0eee8"/>
  <text x="56" y="389" class="code">--topic wave-7 watch bus</text>

  <path d="M417 336h44" class="arrow" marker-end="url(#arrow)"/>
  <rect x="466" y="259" width="390" height="157" rx="12" fill="#193842"/>
  <circle cx="497" cy="292" r="14" fill="#c4e7d9"/>
  <text x="497" y="297" class="number" style="fill:#193842">4</text>
  <text x="522" y="298" class="heading" style="fill:#f6fbfb">Alice revokes Bob's seat</text>
  <text x="487" y="331" style="fill:#f6fbfb">Only remaining readers receive the new key.</text>
  <text x="487" y="353" style="fill:#f6fbfb">Bob keeps the epochs he received earlier.</text>
  <rect x="487" y="371" width="260" height="27" rx="5" fill="#e0eee8"/>
  <text x="498" y="389" class="code">topic revoke wave-7 BOB_NPUB</text>
</svg>
