# kubectl apply -k deploy/nostr-relay
#
# Builds the relay's ConfigMap from relay.yaml, the same file the compose stack mounts,
# so the three gates (auth_required, membership_required, inviteMaxUses) are written
# down once. kustomize names the ConfigMap after its contents and rewrites the
# StatefulSet's reference to match.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kubernetes.yaml
configMapGenerator:
  - name: nostr-relay-config
    namespace: nostr-relay
    files:
      - relay.yaml


